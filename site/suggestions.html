// The decision-critical questions. Everything the site cannot answer is here, with the route that settles it.
const QUESTIONS = [
  ["Q-01", "Is the trust revocable, or otherwise counted in the parent's estate?",

  ["Q-02", "Will the house be the parent's principal residence on the date of death?",
    "The family-home exclusion needs the house to remain the parent's home, then the heir's, and to keep qualifying for the homeowners' exemption.",
    "Whether it is rented, held in an entity, or vacant, and when.",
    "County assessor, and the parent's own plans.",
    "Yes: the exclusion is available if the heir claims it and moves in within one year. No: the house is reassessed in the live-in case as well, and the live-in saving disappears.",
    "boeLta2026026"],
  ["Q-03", "How much money is inherited, in what accounts, with which beneficiaries?",
    "The federal threshold is $15,000,000 for 2026 and $15,480,000 for 2027; above it the tax reaches 40%. Only the parent's own assets count.",

    "Below the headroom: no federal estate tax. Above it: 40% of the excess, which no plan currently includes.",

  ["Q-04", "What would it cost to rebuild, and what will a policy cost at that limit?",

    "cdiResGuide"],
  ["Q-05", "Will earthquake cover be carried on either property?",

    "Cover: a known yearly cost in the hold cases and a smaller tail loss. No cover: the tail loss stays uninsured and the cost comparison is unchanged.",

    "The household.",
    "Live in A: give up the rent-free San Francisco unit and any rent from it. Stay in B: sell A, invest the net proceeds, and keep both units earning.",

function choice(id) {
  return `<select class="js-choice" data-choice="${id}" aria-label="Your decision on ${id}">${OPTIONS.map(o => `<option value="${o}" ${(chosen[id] || "Not decided") === o ? "selected" : ""}>${o}</option>`).join("")}</select>`;
}
const row = cells => "<tr>" + cells.join("") + "</tr>";
const td = (html, cls = "wrap") => `<td class="${cls}">${html}</td>`;
const sourceCell = keys => keys.map(k => src(k)).join("<br>");

main.innerHTML = UI.hero("Suggestions · decide before you implement",

  `<a class="button" href="plan.html">Read the plan first</a><a class="button secondary" href="review.html">Open items register</a><a class="button secondary" href="sources.html">Source register</a>`) + `<div class="container">

<section class="section">
  <div class="section-heading"><div><div class="eyebrow">Read this first</div><h2>What the site already answers, and what this page adds</h2><p>Four pages carry the decision as it stands. This page does not repeat them; it lists what would make them better and lets you record which changes you want.</p></div></div>
  <div class="grid four">

    <div class="card"><div class="metric-label">The stress test</div><h3>Bad decades included</h3><p class="tiny">Recorded inflation, home-price and market histories are replayed in different orders on <a href="black-swan.html">Recorded data</a> and <a href="stress.html">50-year paths</a>.</p></div>
    <div class="card"><div class="metric-label">The open items</div><h3>Nothing is hidden</h3><p class="tiny">Every blank, every unverified figure and every official document still to be read is on <a href="review.html">Flagged for Review</a> with the route that settles it.</p></div>
  </div>
</section>

<section class="section">
  <div class="section-heading"><div><div class="eyebrow">Method</div><h2>How to choose a path before anything is implemented</h2><p>Five rules, then four steps. The rules are the test every suggestion has to pass; the steps are the order that removes the most uncertainty for the least effort.</p></div></div>

    <div class="card soft"><h3>1 · Unblock what only the family holds</h3><p>The trust document, the deed, the parent's occupancy and the asset list cannot be researched. They are also the only facts that can change the ranking outright. Do these first even though they cost a meeting rather than a click.</p></div>

  </div>
</section>

<section class="section">
  <div class="section-heading"><div><div class="eyebrow">Suggestions register</div><h2>Fifteen improvements to the analysis, in suggested order</h2><p>Each row states what to do, why it changes or protects the decision, how much effort it takes, when it should happen, and the official page the reasoning rests on. Choose approve, defer or decline in the last column; the summary at the bottom of the page updates as you go.</p></div></div>
  <div class="table-wrap"><table><thead><tr><th>#</th><th class="wrap">Suggestion</th><th class="wrap">Why it changes or protects the decision</th><th>Effort</th><th>When</th><th class="wrap">Official evidence</th><th>Your choice</th></tr></thead><tbody>

  <div class="table-wrap"><table><thead><tr><th>#</th><th class="wrap">Question</th><th class="wrap">What the site has now</th><th class="wrap">What is missing</th><th class="wrap">Where the answer is</th><th class="wrap">If it goes one way, or the other</th><th class="wrap">Official route</th></tr></thead><tbody>

<section class="section">

<section class="section">

  <div class="timeline">
    <div class="step"><div class="step-number">1</div><div class="step-body"><div class="deadline">This month · no cost but a meeting</div><h3>Answer the four questions that can change the answer</h3><p>Trust type and what it holds (A-01, A-10); the parent's occupancy and how title is held (A-02); the full asset list with beneficiaries (A-08); and whether the heir would ever live in Cupertino (Q-07). Done when each answer is written down with its date and its source document.</p></div></div>
    <div class="step"><div class="step-number">2</div><div class="step-body"><div class="deadline">Next 90 days · free or low cost</div><h3>Replace four assumptions with quotes and official figures</h3><p>Rebuild cost and a homeowners quote (A-03); an earthquake decision and quote (A-04); the FY2027 rent benchmark and current tariffs (A-05, A-13); and the break-even home-price rate recorded as a monitoring rule (A-14). Done when each figure on the site is either replaced by a dated official value or still marked unverified on purpose.</p></div></div>

  </div>
</section>

<section class="section">
  <div class="section-heading"><div><div class="eyebrow">Guardrails</div><h2>What must not change while these are implemented</h2></div></div>
  <div class="grid three">
    <div class="card"><h3>Privacy</h3><p>No names, addresses, parcel numbers, account numbers, trust documents or unrounded household figures enter the repository or the site. The public history is already a finding on <a href="review.html">Flagged for Review</a>.</p></div>
    <div class="card"><h3>Verification</h3><p>A figure is either published by an official body, linked to that body, or blank. Rounding to $10 is a privacy measure, not a claim of accuracy, and it does not make a household input verified.</p></div>
    <div class="card"><h3>The recommendation</h3><p>Selling Property A and keeping Property B remains the published result until a fact changes it. None of these suggestions, implemented alone, changes that result; A-01, A-02, A-03, A-04, A-08 and A-12 are the ones that could.</p></div>
  </div>
  <p class="tiny" style="margin-top:18px">This page is a planning aid, not legal, tax, insurance or investment advice. Re-check every official page before acting; the register of sources and their review dates is on <a href="sources.html">Sources</a>.</p>
</section>
</div>`;

function updateSummary() {
  const counts = { Approve: 0, Defer: 0, Decline: 0 };
  const approved = [], deferred = [];
  IDEAS.concat(SITE.map(([id, title]) => [id, title])).forEach(([id, title]) => {
    const c = chosen[id];
    if (c === "Approve") { counts.Approve++; approved.push([id, title]); }
    if (c === "Defer") { counts.Defer++; deferred.push([id, title]); }
    if (c === "Decline") counts.Decline++;
  });
  const total = IDEAS.length + SITE.length;
  const undecided = total - counts.Approve - counts.Defer - counts.Decline;
  const stamp = chosen.__updated ? new Date(chosen.__updated).toISOString().slice(0, 10) : "not yet";
  document.getElementById("summary-card").innerHTML = `<div class="metric-label">Approved · deferred · declined · undecided</div>
    <div class="metric small">${counts.Approve} · ${counts.Defer} · ${counts.Decline} · ${undecided}</div>
    <p class="tiny">Last change: ${stamp}. ${counts.Approve === 0 ? "Nothing is approved yet, so nothing should be implemented." : "Only approved items are cleared to implement, and only after an official source is found for each figure they touch."}</p>
    ${approved.length ? `<p><strong>Approved, in the order they should be done:</strong></p><ol class="list">${approved.map(([id, t]) => `<li>${id} — ${t}</li>`).join("")}</ol>` : ""}
    ${deferred.length ? `<p><strong>Deferred:</strong></p><ul class="list">${deferred.map(([id, t]) => `<li>${id} — ${t}</li>`).join("")}</ul>` : ""}`;
}

function saveChoice(id, value) {
  if (value === "Not decided") delete chosen[id]; else chosen[id] = value;
  chosen.__updated = Date.now();
  try { window.localStorage.setItem(KEY, JSON.stringify(chosen)); } catch (e) { /* private mode: keep in memory */ }
  updateSummary();
}

document.addEventListener("change", event => {
  const select = event.target.closest("select.js-choice");
  if (!select) return;
  saveChoice(select.dataset.choice, select.value);
});

document.getElementById("print").addEventListener("click", () => window.print());
document.getElementById("clear").addEventListener("click", () => {
  if (!window.confirm("Clear every recorded choice in this browser?")) return;
  chosen = {};
  try { window.localStorage.removeItem(KEY); } catch (e) {}
  document.querySelectorAll("select.js-choice").forEach(s => { s.value = "Not decided"; });
  updateSummary();
  document.getElementById("status").textContent = "All choices cleared.";
});
document.getElementById("copy").addEventListener("click", () => {
  const lines = ["Suggestions and decisions — recorded " + new Date().toISOString().slice(0, 10)];
  IDEAS.concat(SITE.map(([id, title]) => [id, title])).forEach(([id, title]) => {
    const c = chosen[id] || "Not decided";
    if (c !== "Not decided") lines.push(c + " · " + id + " · " + title);
  });
  if (lines.length === 1) lines.push("No choices recorded.");
  const text = lines.join("\n");
  const done = () => { document.getElementById("status").textContent = "Summary copied to the clipboard."; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => { document.getElementById("status").textContent = "Could not copy; select the summary text and copy it manually."; });
  } else {
    const area = document.createElement("textarea");
    area.value = text; document.body.appendChild(area); area.select();
    try { document.execCommand("copy"); done(); } catch (e) { document.getElementById("status").textContent = "Could not copy; select the summary text and copy it manually."; }
    area.remove();
  }
});

updateSummary();
</script></body></html>
