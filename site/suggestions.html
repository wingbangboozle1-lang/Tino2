<section class="section">
  <div class="section-heading"><div><div class="eyebrow">Dashboard changes</div><h2>Six suggestions for the site itself</h2><p>These change how the analysis is read, not what it says. None of them alters a model input or a published figure. The first is already built on this page; the rest are proposals.</p></div></div>
  <div class="grid two">
  ${SITE.map(([id, title, why, effort, built]) => `<div class="card"><h3>${id} · ${title}</h3>${UI.badge(built ? "Built here" : "Proposed", built ? "" : "gold")}<p>${why}</p><p class="tiny">Effort: ${effort}${built ? " · printing this page keeps your recorded choices" : ""}</p><p class="tiny">${choice(id)}</p></div>`).join("")}
  </div>
</section>

<section class="section">
  <div class="section-heading"><div><div class="eyebrow">Suggested sequence</div><h2>What to do first, and what “done” looks like</h2><p>An order that front-loads the facts that can change the recommendation and leaves the research that only sharpens it until afterwards.</p></div></div>
  <div class="timeline">
    <div class="step"><div class="step-number">1</div><div class="step-body"><div class="deadline">This month · no cost but a meeting</div><h3>Answer the four questions that can change the answer</h3><p>Trust type and what it holds (A-01, A-10); the parent's occupancy and how title is held (A-02); the full asset list with beneficiaries (A-08); and whether the heir would ever live in Cupertino (Q-07). Done when each answer is written down with its date and its source document.</p></div></div>
    <div class="step"><div class="step-number">2</div><div class="step-body"><div class="deadline">Next 90 days · free or low cost</div><h3>Replace four assumptions with quotes and official figures</h3><p>Rebuild cost and a homeowners quote (A-03); an earthquake decision and quote (A-04); the FY2027 rent benchmark and current tariffs (A-05, A-13); and the break-even home-price rate recorded as a monitoring rule (A-14). Done when each figure on the site is either replaced by a dated official value or still marked unverified on purpose.</p></div></div>
    <div class="step"><div class="step-number">3</div><div class="step-body"><div class="deadline">Every year, on a fixed date</div><h3>Run the calendar, not the whole site</h3><p>March: the San Francisco Rent Board resets its allowable increase and relocation amounts. October: HUD publishes the next rent benchmark. Autumn: the IRS publishes the next estate exclusion. Every other February: the Board of Equalization adjusts the Proposition 19 amount. December: the Rent Board fee exemption window closes. Done when each date has been checked and the change, if any, is recorded.</p></div></div>
    <div class="step"><div class="step-number">4</div><div class="step-body"><div class="deadline">In the inheritance year</div><h3>File first, then decide</h3><p>Claim the homeowners' exemption within one year and the intergenerational exclusion within three years or before any sale to a third party. Sell or hold only after the assessed value is confirmed, because the whole comparison turns on which value is enrolled. Done when the assessor's enrolled value matches the plan's assumption.</p></div></div>
    <div class="step"><div class="step-number">5</div><div class="step-body"><div class="deadline">After implementing anything</div><h3>Re-verify, then record the change</h3><p>An approved suggestion is implemented only with an official source, rounded figures, and a note on <a href="verification.html">Verified facts</a>. Then record here what was done and set the next review date. The decision record is the only artefact that shows why the site says what it says at a given moment.</p></div></div>
  </div>
</section>

<section class="section" id="record">
  <div class="section-heading"><div><div class="eyebrow">Your record</div><h2>Choose the path, then print or copy it</h2><p>Your choices are stored only in this browser, under a single key, with the date of the last change. Nothing is transmitted, and clearing the browser data erases them. Print the page to keep a copy with your papers.</p></div></div>
  <div class="grid two">
    <div class="card highlight" id="summary-card" aria-live="polite"></div>
    <div class="card"><h3>What a recorded choice means</h3><ul class="list">
      <li><strong>Approve</strong> — implement it, using an official source and rounded figures, then note it on Verified facts.</li>
      <li><strong>Defer</strong> — keep it open deliberately. Say why in the note you keep with your papers; a deferral on a dated item is a decision with a cost.</li>
      <li><strong>Decline</strong> — the site will keep stating the figure as unknown. That is acceptable only if you accept the uncertainty it leaves.</li>
    </ul><div class="hero-actions"><button class="button" id="print">Print or save as PDF</button><button class="button secondary" id="copy">Copy the summary</button><button class="button secondary" id="clear">Clear all choices</button></div><p class="tiny" id="status" role="status" style="margin-top:12px"></p></div>
  </div>
</section>

<section class="section">
  <div class="section-heading"><div><div class="eyebrow">Guardrails</div><h2>What must not change while these are implemented</h2></div></div>
  <div class="grid three">
    <div class="card"><h3>Privacy</h3><p>No names, addresses, parcel numbers, account numbers, trust documents or unrounded household figures enter the repository or the site. The public history is already a finding on <a href="review.html">Flagged for Review</a>.</p></div>
    <div class="card"><h3>Verification</h3><p>A figure is either published by an official body, linked to that body, or blank. Rounding to $10 is a privacy measure, not a claim of accuracy, and it does not make a household input verified.</p></div>
    <div class="card"><h3>The recommendation</h3><p>Selling Property A and keeping Property B remains the published base case until a fact changes it. None of these suggestions, implemented alone, changes that result; A-01, A-02, A-03, A-04, A-08 and A-12 are the ones that could.</p></div>
  </div>
  <div class="card soft" style="margin-top:18px"><h3>How to use this list</h3><p>Start with the privacy alternatives; then resolve the high-impact unknowns in the <a href="review.html">Flagged for Review</a> register. The current sell-and-reinvest ranking is conditional on modeled assumptions and is not a filing-ready recommendation. Check the <a href="stress.html">black-swan scenarios</a> and the <a href="inheritance.html">inheritance steps</a> before deciding.</p><p class="tiny">This page is a planning aid, not legal, tax, insurance or investment advice. Re-check every official page before acting; the register of sources and their review dates is on <a href="sources.html">Sources</a>.</p></div>

function updateSummary() {
  const counts = { Approve: 0, Defer: 0, Decline: 0 };
  const approved = [], deferred = [];
  IDEAS.concat(SITE.map(([id, title]) => [id, title])).forEach(([id, title]) => {
    const c = chosen[id];
    if (c === "Approve") { counts.Approve++; approved.push([id, title]); }
    if (c === "Defer") { counts.Defer++; deferred.push([id, title]); }
    if (c === "Decline") counts.Decline++;
  });
  const total = IDEAS.length + SITE.length;
  const undecided = total - counts.Approve - counts.Defer - counts.Decline;
  const stamp = chosen.__updated ? new Date(chosen.__updated).toISOString().slice(0, 10) : "not yet";
  document.getElementById("summary-card").innerHTML = `<div class="metric-label">Approved · deferred · declined · undecided</div>
    <div class="metric small">${counts.Approve} · ${counts.Defer} · ${counts.Decline} · ${undecided}</div>
    <p class="tiny">Last change: ${stamp}. ${counts.Approve === 0 ? "Nothing is approved yet, so nothing should be implemented." : "Only approved items are cleared to implement, and only after an official source is found for each figure they touch."}</p>
    ${approved.length ? `<p><strong>Approved, in the order they should be done:</strong></p><ol class="list">${approved.map(([id, t]) => `<li>${id} — ${t}</li>`).join("")}</ol>` : ""}
    ${deferred.length ? `<p><strong>Deferred:</strong></p><ul class="list">${deferred.map(([id, t]) => `<li>${id} — ${t}</li>`).join("")}</ul>` : ""}`;
}

function saveChoice(id, value) {
  if (value === "Not decided") delete chosen[id]; else chosen[id] = value;
  chosen.__updated = Date.now();
  try { window.localStorage.setItem(KEY, JSON.stringify(chosen)); } catch (e) { /* private mode: keep in memory */ }
  updateSummary();
}

document.addEventListener("change", event => {
  const select = event.target.closest("select.js-choice");
  if (!select) return;
  saveChoice(select.dataset.choice, select.value);
});

document.getElementById("print").addEventListener("click", () => window.print());
document.getElementById("clear").addEventListener("click", () => {
  if (!window.confirm("Clear every recorded choice in this browser?")) return;
  chosen = {};
  try { window.localStorage.removeItem(KEY); } catch (e) {}
  document.querySelectorAll("select.js-choice").forEach(s => { s.value = "Not decided"; });
  updateSummary();
  document.getElementById("status").textContent = "All choices cleared.";
});
document.getElementById("copy").addEventListener("click", () => {
  const lines = ["Suggestions and decisions — recorded " + new Date().toISOString().slice(0, 10)];
  IDEAS.concat(SITE.map(([id, title]) => [id, title])).forEach(([id, title]) => {
    const c = chosen[id] || "Not decided";
    if (c !== "Not decided") lines.push(c + " · " + id + " · " + title);
  });
  if (lines.length === 1) lines.push("No choices recorded.");
  const text = lines.join("\n");
  const done = () => { document.getElementById("status").textContent = "Summary copied to the clipboard."; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => { document.getElementById("status").textContent = "Could not copy; select the summary text and copy it manually."; });
  } else {
    const area = document.createElement("textarea");
    area.value = text; document.body.appendChild(area); area.select();
    try { document.execCommand("copy"); done(); } catch (e) { document.getElementById("status").textContent = "Could not copy; select the summary text and copy it manually."; }
    area.remove();
  }
});

updateSummary();
</script></body></html>
