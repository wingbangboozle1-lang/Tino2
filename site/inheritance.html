<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Step-by-step trust inheritance checklist: trustee notices, assessor forms, Proposition 19, tax basis, federal estate filing and distribution."><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../assets/styles.css"></head>
<body data-title="Trust inheritance checklist">
<main id="main"></main><div data-footer></div>
<script src="data/sources.js"></script><script src="data/model.js"></script><script src="../assets/app.js"></script>
<script>
const main = document.getElementById("main");
const steps = [
  ["Before a death · planning", "Make the file usable without making it public", "Keep the signed trust and every amendment, deeds, title report, beneficiary and successor-trustee provisions, prior gift-tax returns, property tax bills, insurance, leases and utility records together privately. Confirm the trust actually holds title and document principal-residence use. Do not upload private records to this dashboard.", "Estate attorney + title professional", null],
  ["Day 0", "Establish authority, valuation date and property protection", "The successor trustee should obtain legal advice, secure original documents, notify insurers, maintain utilities and preserve lease records. For trust-held California real estate, the assessor’s change-of-ownership date is the date of death—not later distribution. Obtain date-of-death fair-market-value appraisals for tax basis and estate reporting.", "Successor trustee + appraiser", "boeDeath"],
  ["Within 60 days, when applicable", "Serve the statutory trust notice", "California Probate Code §16061.7 generally requires notice when a revocable trust becomes irrevocable because of a settlor’s death, on beneficiaries and heirs as specified. The statute also covers later-discovered recipients, trustee vacancies and other triggering events. Counsel should determine recipients, content and service method from the actual trust.", "Trust attorney + trustee", "caTrustNotice"],
  ["Within 150 days", "File BOE-502-D for each parcel in each county", "File the Change in Ownership Statement—Death of Real Property Owner with the assessor in every county where the decedent owned an interest, including trust-held property. Probate uses a different tie to filing the inventory and appraisal; an assessor’s written request can create another deadline. Filing a sale deed does not replace the required death statement.", "Trustee + assessor", "boeDeath"],
  ["Within 1 year / within 3 years", "If occupying Property A, protect Proposition 19 relief", "At least one eligible transferee must make the family home a principal residence within one year and file for the homeowners’ or disabled veterans’ exemption within one year for relief from the transfer date. File BOE-19-P within three years and before a third-party transfer, or within six months after the assessor mails a qualifying supplemental/escape notice. Later relief can be prospective only. Renting does not qualify.", "Occupying beneficiary + assessor", "boeProp19"],
  ["Promptly; return thresholds vary", "Set up tax administration and preserve basis", "Obtain a new EIN when a revocable trust becomes irrevocable; determine Forms 1041, 1040 and state fiduciary filing duties. Reconcile date-of-death basis, improvements, selling expenses, rental land/building allocation and depreciation. Beneficiary and fiduciary reporting can differ; use a tax professional rather than this dashboard’s cash-flow proxy.", "CPA / enrolled agent", "irsEIN"],
  ["Within 9 months if Form 706 is required", "Evaluate estate filing, payment and portability", "Form 706 and any federal estate tax are generally due nine months after death. Filing can be required above the applicable threshold or to elect DSUE portability even below it. A filing extension is not an automatic payment extension. Citizenship, prior gifts, deductions, debts and prior deceased-spouse elections require actual records.", "Estate attorney + CPA", "irs706"],
  ["Before commitment or distribution", "Choose occupancy, rental or sale—then document it", "Compare the same-endpoint scenarios, obtain actual insurance and rent quotes, confirm title and lease/legal constraints, and model supplemental tax bills. Follow the trust’s allocation, accounting and distribution provisions. Record required affidavits/deeds and retain evidence of notices, claims, appraisals, tax filings and beneficiary receipts.", "Trustee + attorney + tax adviser", "sfDeath"]
];
main.innerHTML = UI.hero("Trust administration · action plan", "The deadline clock starts at death.", "A practical, source-linked sequence for the successor trustee and beneficiary. Private documents stay offline; only procedural guidance and placeholder property labels appear here.", `<a class="button" href="review.html">Open document gaps</a><a class="button secondary" href="estate-tax.html">Estate-tax thresholds</a>`) + `<div class="container">
<section class="section"><div class="callout warning"><strong>Use the actual trust and current forms.</strong> This checklist is not a substitute for legal notice, a probate determination, an assessor claim or a tax return. “Within” periods below are not permission to wait; assessor and tax obligations can have earlier or additional triggers.</div></section>
<section class="section"><div class="section-heading"><div><div class="eyebrow">Step by step</div><h2>From private file to informed decision</h2></div></div><div class="timeline">
${steps.map((s,i) => `<div class="step"><div class="step-number">${i+1}</div><div class="step-body"><span class="deadline">${s[0]}</span><h3>${s[1]}</h3><p>${s[2]}</p><div class="meta-row"><span class="badge neutral">${s[3]}</span></div>${s[4] ? `<p style="margin-top:12px">${UI.source(s[4])}</p>` : ""}</div></div>`).join("")}
</div></section>
<section class="section"><div class="section-heading"><div><div class="eyebrow">Deadline matrix</div><h2>Four separate clocks</h2><p>Do not treat one filing as satisfying another. The shortest applicable deadline controls.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Obligation</th><th>General trigger / timing</th><th class="wrap">Important qualification</th><th>Official source</th></tr></thead><tbody>
<tr><td><strong>Trust notification</strong></td><td>60 days</td><td class="wrap">Applies on listed events; later-discovered recipient and trustee-vacancy rules can change the start.</td><td class="source">${UI.source("caTrustNotice")}</td></tr>
<tr><td><strong>BOE-502-D</strong></td><td>150 days after death</td><td class="wrap">Each parcel, each county. Probate and assessor-request rules differ.</td><td class="source">${UI.source("boeDeath")}</td></tr>
<tr><td><strong>Principal-residence use + exemption</strong></td><td>Within 1 year</td><td class="wrap">Needed for Proposition 19 relief from transfer date; continued qualifying use matters.</td><td class="source">${UI.source("boeProp19")}</td></tr>
<tr><td><strong>BOE-19-P</strong></td><td>Within 3 years</td><td class="wrap">Also before third-party transfer; six-month notice alternative and prospective late relief exist.</td><td class="source">${UI.source("boeProp19")}</td></tr>
<tr><td><strong>Form 706 / estate tax</strong></td><td>Generally 9 months</td><td class="wrap">Required by estate threshold or portability election; payment extension is not automatic.</td><td class="source">${UI.source("irs706")}</td></tr>
</tbody></table></div></section>
<section class="section"><div class="section-heading"><div><div class="eyebrow">Income-tax basis</div><h2>Stepped-up basis is not assessed value</h2><p>Property tax assessment and federal income-tax basis are separate calculations. Inherited-property basis is generally fair market value at death, subject to exceptions and special rules.</p></div>${UI.source("irsBasis")}</div>
<div class="grid three" id="basis-cards"></div>
<div class="callout"><strong>Planning implication:</strong> an immediate sale near the date-of-death appraised value can have little gain before selling costs. Keeping the property exposes later appreciation above basis to capital-gain rules. Do not use the $550,537 assessed-value input as the federal basis.</div>
</section>
<section class="section"><div class="section-heading"><div><div class="eyebrow">Private document request</div><h2>What the professionals will need</h2><p>None of these records belongs on the public site.</p></div></div><div class="grid two">
<div class="card"><h3>Trust, title and people</h3><ul class="check-list"><li>Complete signed trust, amendments, restatements and pour-over will</li><li>Current deed, acquisition deed, title report and legal description</li><li>Certified death certificate and trustee acceptance</li><li>Beneficiary/heir contact and relationship evidence—shared privately</li><li>Prior deeds, entity interests, cotenant or marital-property agreements</li><li>Any prior Forms 709 and DSUE/portability records</li></ul></div>
<div class="card"><h3>Property and tax</h3><ul class="check-list"><li>Date-of-death appraisal and full asset/liability inventory</li><li>Current secured, supplemental and escape tax bills</li><li>Insurance declarations and property-specific quotes</li><li>Leases, rent roll, rent-control coverage and tenant notices</li><li>Improvement invoices, land/building allocation and prior depreciation</li><li>Mortgage, utility, solar tariff, maintenance and management records</li></ul></div>
</div></section>
<section class="section"><div class="card highlight"><h2>The decision gate</h2><p>Do not choose “live” merely to preserve the old tax bill: high-value relief is partial. Do not choose “rent” using gross rent alone: reassessment, vacancy, management, maintenance and tax treatment matter. Do not choose “sell” without an actual reinvestment and housing plan. Use the <a href="decision.html">interactive comparison</a>, then validate the winning scenario against real quotes, title, trust terms and tax advice.</p></div></section>
</div>`;
const a2040 = MODEL.seriesFor("A",2040).market;
document.getElementById("basis-cards").innerHTML = [
  ["Assessed value · 2040 model", MODEL.seriesFor("A",2040).assessed, "Property-tax continuation only; not basis"],
  ["Date-of-death FMV · 2040 model", a2040, "General federal starting basis, subject to actual appraisal and exceptions"],
  ["Old assessed-value input · 2026", 550537, "Do not substitute for date-of-death FMV"]
].map(([label,value,note]) => `<div class="card"><div class="metric-label">${label}</div><div class="metric small">${UI.money(value)}</div><p class="tiny">${note}</p></div>`).join("");
</script></body></html>
