<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Official source register, model methodology, assumptions, data classifications and legal-change watchlist."><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../assets/styles.css"></head>
<body data-title="Sources and methodology">
<main id="main"></main><div data-footer></div>
<script src="data/sources.js"></script><script src="data/model.js"></script><script src="../assets/app.js"></script>
<script>
const main=document.getElementById("main");
const assumptions=[
 ["Home-price growth","3.5% annually","Both properties; deterministic scenario, not a forecast","fedInflation","2% inflation target is context, not home-price guidance"],
 ["Assessment growth","2% annually","Prop 13 maximum scenario; actual factor can be lower and events can reset value","boeProp13","Official assessment framework"],
 ["Expense inflation","3% annually","Insurance and household utility midpoints; solar credit held flat","insurance","Actual premiums and metered bills required"],
 ["Property A rent growth","3% annually","Applied to FY2026 HUD gross-rent benchmark","hudA","Not a legal cap or guaranteed contract rent"],
 ["Property B rent growth","1.6% annually","Current covered-unit rate extrapolated beyond its published period","sfRent","Coverage and future rates must be checked"],
 ["Vacancy reserve","5% of gross rent","Both rental scenarios; no observed vacancy history","irsRental","Actual rental records required"],
 ["Management reserve","8% of collected rent","No management quote supplied","irsRental","Scenario expense, not official rate"],
 ["Maintenance reserve","0.5% A / 1.0% B of market value","Annual scenario reserve; capital projects excluded","irsRental","Repair/capital classification not modeled"],
 ["Sale cost","6% of terminal sale price","Applied to immediate and deferred property sales","irsBasis","Scenario only; actual settlement statement required"],
 ["Portfolio return","6% gross / 5% after annual tax drag","Diversified-reinvestment proxy; no guaranteed return","investorRisk","Risk and tax lots are simplified"],
 ["Rental income-tax scenario","33.3% of positive NOI","No loss refund; no depreciation or passive-loss benefit","irsRental","NOI is not taxable income"],
 ["Capital-gain scenario","33.1%","High-bracket illustration, not taxpayer-specific","caCapGains","Federal, NIIT and California treatment need actual return"],
 ["Main-home exclusion","$250,000 when horizon ≥2 years","Applied to live case only; eligibility tests still required","irsHomeSale","No $500,000 amount assumed"],
 ["Estate exclusion growth","2% annually after 2026","2026 $15 million official; later values modeled","irsEstate","Not an IRS forecast"],
 ["Baseline CPI inflation","2.3% annually (scenario page)","Costs and market rent grow at CPI + 0.7 pt = 3.0%; matches the lab","cbo","CBO projects inflation near the Fed's 2% target from 2030; exact 2.3% flagged"],
 ["Portfolio mix (stress tests)","60% equities / 40% 10-year-yield sleeve","Baseline equities 7.0% gross, safe sleeve 4.5%, 1-pt tax drag = 5.0% net, equal to the lab","fredGS10","Fixed mix; no rebalancing, fees or bond price changes"],
 ["Dividend assumption (stress tests)","+2.0 pts on the OECD price index","Series excludes dividends","fredOECD","Flat assumption, not recorded"],
 ["Prop 19 exclusion growth","Compounds at home-price growth every two years after current period","2025–27 $1,044,586 official; later amounts modeled","boeProp19Amount","BOE indexes to FHFA California HPI (NR 25-02); actual future adjustments unknown"]
];
main.innerHTML=UI.hero("Evidence and reproducibility", "Every claim has a classification.", "Official sources support law and published benchmarks. Household inputs support only the starting scenario. Calculations are deterministic, assumptions are adjustable where material, and unknown values remain blank.", `<a class="button secondary" href="review.html">Unresolved items ⚑</a>`)+`<div class="container">
<section class="section"><div class="section-heading"><div><div class="eyebrow">Reading the dashboard</div><h2>Five labels, five different levels of confidence</h2></div></div><div class="grid three">
<div class="card">${UI.status("official")}<h3 style="margin-top:12px">Published law or benchmark</h3><p class="muted">Linked to an official government page, form, statute, rate book or methodology. A current rule is not a promise about 2040.</p></div>
<div class="card">${UI.status("input")}<h3 style="margin-top:12px">Household planning input</h3><p class="muted">User-supplied value, bill, rent or utility estimate. It is not independently verified and never acquires official status from a nearby link.</p></div>
<div class="card">${UI.status("derived")}<h3 style="margin-top:12px">Arithmetic from inputs</h3><p class="muted">Example: $7,210 ÷ $539,740 = 1.3358%. That derived ratio is not an official tax-rate-area rate.</p></div>
<div class="card">${UI.status("assumption")}<h3 style="margin-top:12px">Scenario assumption</h3><p class="muted">Chosen for modeling, such as appreciation, vacancy or returns. Sensitivity controls expose important choices.</p></div>
<div class="card">${UI.badge("Review","red")}<h3 style="margin-top:12px">Unknown, not zero</h3><p class="muted">Unconfirmed parcel, legal, insurance, estate or lease facts remain blank and appear in the review queue.</p></div>
<div class="card">${UI.badge("Projection","gold")}<h3 style="margin-top:12px">Calculated future value</h3><p class="muted">Rounded to the nearest $10. Calculations run in <span class="code">site/data/model.js</span>; no data is transmitted to a backend.</p></div>
</div></section>
<section class="section"><div class="section-heading"><div><div class="eyebrow">Assumption register</div><h2>What drives the numbers</h2><p>Official links describe context or law; they do not convert scenario assumptions into forecasts.</p></div></div><div class="table-wrap"><table><thead><tr><th>Input</th><th>Base setting</th><th class="wrap">Use and limitation</th><th>Official context</th></tr></thead><tbody>${assumptions.map(a=>`<tr><td><strong>${a[0]}</strong></td><td>${a[1]}</td><td class="wrap">${a[2]}<br><span class="tiny">${a[4]}</span></td><td class="source">${UI.source(a[3])}</td></tr>`).join("")}</tbody></table></div></section>
<section class="section" id="watchlist"><div class="section-heading"><div><div class="eyebrow">Legal-change watchlist</div><h2>Proposals do not change the current model</h2><p>Reviewed 10–11 November 2026. Revisit before an actual transfer, filing, lease increase or sale. No pending proposal reduces modeled tax or expands a benefit.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Measure</th><th>Status at review</th><th class="wrap">Relevance and model treatment</th><th>Official status</th></tr></thead><tbody>
<tr><td><strong>H.R.1301 · 119th Congress</strong><br>Death Tax Repeal Act</td><td>${UI.badge("Introduced · not enacted","gold")}</td><td class="wrap">Federal estate-tax proposal. Current $15 million exclusion and filing rules remain unchanged.</td><td class="source">${UI.source("hr1301")}</td></tr>
<tr><td><strong>H.R.601 · 119th Congress</strong><br>Estate Tax Rate Reduction Act</td><td>${UI.badge("Introduced · not enacted","gold")}</td><td class="wrap">Federal estate-tax rate proposal. No rate reduction is included in scenarios.</td><td class="source">${UI.source("hr601")}</td></tr>
<tr><td><strong>H.R.7034 · 119th Congress</strong><br>Principal-residence proposal</td><td>${UI.badge("Introduced · not enacted","gold")}</td><td class="wrap">No expansion of the current main-home exclusion is modeled.</td><td class="source">${UI.source("hr7034")}</td></tr>
<tr><td><strong>SF File 261020</strong><br>Banked / capital-improvement increases</td><td>${UI.badge("Pending committee · not enacted","gold")}</td><td class="wrap">Proposed three-year 10% combined annual cap for rent-controlled units. Introduced September 15, 2026; no final action at review and no effect on the model.</td><td class="source">${UI.source("sfRentProposal")}</td></tr>
<tr><td><strong>AB 1482</strong><br>Current statutory sunset</td><td>${UI.badge("Current law · 1 Jan 2030 sunset","gold")}</td><td class="wrap">The current statewide law lists a January 1, 2030 expiration. Long-range rent growth remains a scenario, not a prediction of future rent-control law.</td><td class="source">${UI.source("sfAB1482")}</td></tr>
<tr><td><strong>California SB 974 · 2025–26</strong><br>Special-needs-trust clarification</td><td>${UI.badge("Chaptered 27 Sep 2026")}</td><td class="wrap">Chapter 665, Statutes of 2026. Narrow trust clarification; not a general restoration of pre-Proposition 19 rental exclusions.</td><td class="source">${UI.source("sb974")}</td></tr>
<tr><td><strong>Proposition 19 exclusion</strong><br>Next biennial adjustment</td><td>${UI.badge("Future amount unknown","gold")}</td><td class="wrap">Current amount applies through February 15, 2027. Future model indexing is not enacted guidance.</td><td class="source">${UI.source("boeProp19Amount")}</td></tr>
<tr><td><strong>CA Prop 42</strong> · Nov 3, 2026<br>No new state taxes on personal-property ownership; no new retroactive taxes</td><td>${UI.badge("Leading · results uncertified","gold")}</td><td class="wrap">Would restrict a future state tax on ownership of financial assets (not real estate). It does not change estate-tax, property-tax or Prop 19 rules. Unofficial results (51.5% yes) as of Nov 10, 2026; certification due Dec 11, 2026.</td><td class="source">${UI.source("vgProp42")}<div class="tiny">${UI.source("sosResults")}</div></td></tr>
<tr><td><strong>CA Prop 43</strong> · Nov 3, 2026<br>Two-thirds vote for voter-proposed local special taxes</td><td>${UI.badge("Failing · results uncertified","gold")}</td><td class="wrap">Would have raised the vote threshold for voter-proposed local special taxes (e.g., parcel taxes) from Jan 1, 2027. Unofficial results (42.6% yes). No effect on the model.</td><td class="source">${UI.source("vgProp43")}</td></tr>
<tr><td><strong>CA Prop 40</strong> · Nov 3, 2026<br>One-time tax on certain taxpayers (assets over $1 billion)</td><td>${UI.badge("Failing · results uncertified","gold")}</td><td class="wrap">One-time 5% tax on assets above $1 billion per the official guide. Not applicable to the modeled amounts; no effect on the model.</td><td class="source">${UI.source("vgProp40")}</td></tr>
<tr><td><strong>Federal exclusion</strong><br>Post-2026 indexation</td><td>${UI.badge("Future amounts unknown","gold")}</td><td class="wrap">Current law indexes after 2026; model uses 2% only for scenarios.</td><td class="source">${UI.source("irsEstate")}</td></tr>
</tbody></table></div></section>
<section class="section"><div class="section-heading"><div><div class="eyebrow">Official register</div><h2>Manual review links</h2><p>Each source below was used for a rule, benchmark, procedure or limitation. Review dates and notes are provided so a professional can revalidate the exact proposition.</p></div></div><div class="table-wrap"><table><thead><tr><th>Agency</th><th class="wrap">Document</th><th class="wrap">Use in this dashboard</th><th>Reviewed</th><th>Link</th></tr></thead><tbody id="register"></tbody></table></div></section>
<section class="section"><div class="grid two"><div class="card soft"><h3>Revalidation cadence</h3><ul class="check-list"><li>Before death-related administration: statutes, forms and trust notice</li><li>Each February: Proposition 19 exclusion adjustment cycle</li><li>Each tax year: county/city rates and actual parcel bills</li><li>Before any rent increase: local and AB 1482 coverage and caps</li><li>Each HUD fiscal year: Fair Market Rent updates</li><li>Before a decision: live insurance, management and rent quotes</li><li>Before filing: IRS thresholds, instructions and portfolio records</li></ul></div><div class="card"><h3>Reproduce the model</h3><p>The repository contains dependency-free JavaScript. With Node.js, load <span class="code">site/data/model.js</span> after setting <span class="code">global.window = global</span>; call <span class="code">MODEL.decision({...MODEL.BASE, inheritYear: 2040}, 10)</span>.</p><p>Display rounding is centralized in <span class="code">MODEL.round10()</span> and <span class="code">MODEL.fmtMoney()</span>. Calculations retain full precision until display.</p><p><a href="https://github.com/wingbangboozle1-lang/Tino2" target="_blank" rel="noopener noreferrer">Repository ↗</a> · <a href="../research-portal.html">Previously integrated research portal ↗</a></p></div></div></section>
</div>`;
document.getElementById("register").innerHTML=Object.values(SOURCES).map(s=>`<tr><td>${s.agency}</td><td class="wrap"><strong>${s.title}</strong></td><td class="wrap">${s.note}</td><td>10 Nov 2026</td><td class="source"><a class="source-link" href="${s.url}" target="_blank" rel="noopener noreferrer">Open official source ↗</a></td></tr>`).join("");
</script></body></html>
