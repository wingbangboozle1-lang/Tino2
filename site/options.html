<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Choices, tax rules, kinds of inherited money and filing steps that the sell, rent or live comparison does not cover, each with an official source."><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../assets/styles.css"></head>
<body data-title="Other options and missing steps">
<main id="main"></main><div data-footer></div>
<script src="data/sources.js"></script><script src="data/model.js"></script><script src="data/options.js"></script><script src="../assets/app.js"></script>
<script>
const main = document.getElementById("main"), O = OPTIONS, $ = UI.money, src = UI.source;
const signed = v => (v < 0 ? "−" : "+") + $(Math.abs(v));
const YEARS = [2040, 2045, 2050], MID = 2045;
const d45 = MODEL.decision({ ...MODEL.BASE, inheritYear: MID }, O.HORIZON);
const hold = (k, mode) => O.holdThenSell(MID, k, mode);
const old45 = O.oldRule(MID), dep30 = O.rentWithDepreciation(MID, 0.3);
const blank = `<span class="badge red">Blank · not confirmed</span>`;
const assumption = text => UI.badge(text, "gold");

const holdRows = [1, 2, 3, 5, 10].map(k => {
  const live = hold(k, "live"), rent = hold(k, "rent"), empty = hold(k, "empty");
  return `<tr><td><strong>${k} year${k > 1 ? "s" : ""}</strong></td><td class="number negative">${signed(live.vsSellNow)}</td><td class="number">${$(live.exclusionUsed)}</td><td class="number negative">${signed(rent.vsSellNow)}</td><td class="number negative">${signed(empty.vsSellNow)}</td><td class="source">${src("irsTopic701", "Two-of-five-year rule")}</td></tr>`;
}).join("");

const yearRows = YEARS.map(y => {
  const one = k => O.holdThenSell(y, k, "live").vsSellNow, sell = MODEL.decision({ ...MODEL.BASE, inheritYear: y }, O.HORIZON).sell.terminal;
  return `<tr><td><strong>${y}</strong></td><td class="number">${$(sell)}</td><td class="number negative">${signed(O.holdThenSell(y, 1, "rent").vsSellNow)}</td><td class="number negative">${signed(one(1))}</td><td class="number negative">${signed(one(2))}</td><td class="number negative">${signed(O.holdThenSell(y, 1, "empty").vsSellNow)}</td><td class="source">${src("irsInheritedSale", "Basis at date of death")}</td></tr>`;
}).join("");

const depRows = [0.2, 0.3, 0.4].map(share => {
  const x = O.rentWithDepreciation(MID, share);
  return `<tr><td><strong>${UI.pct(share, 0)}</strong> ${assumption("Assumption")}</td><td class="number">${$(x.deduction)}</td><td class="number positive">${signed(x.saved)}</td><td class="number negative">−${$(x.extraTaxAtSale)}</td><td class="number positive">${signed(x.released)}</td><td class="number">${$(x.terminal)}</td><td class="number">${signed(x.change)}</td><td class="number">${$(x.sellLead)}</td><td class="source">${src("irsPub527", "27.5-year rule")}</td></tr>`;
}).join("");

const oldRows = YEARS.map(y => {
  const x = O.oldRule(y);
  return `<tr><td><strong>${y}</strong></td><td class="number">${$(x.firstTaxNow)}</td><td class="number">${$(x.firstTaxOld)}</td><td class="number">${$(x.rentNow)}</td><td class="number">${$(x.rent)}</td><td class="number">${$(x.sell)}</td><td class="number">${$(x.sellLeadNow)}</td><td class="number">${$(x.sellLead)}</td><td class="number ${x.sellLeadEqualTerms < 0 ? "negative" : ""}">${signed(x.sellLeadEqualTerms)}</td><td class="source">${src("agInitiative250017", "Text of the failed measure")}</td></tr>`;
}).join("");

const estateRows = [2027, 2045].map(y => [5000000, 10000000, 15000000, 20000000, 25000000].map(m => {
  const e = O.estate(y, m);
  return `<tr><td><strong>${y}</strong> ${e.official ? UI.badge("Official exclusion") : assumption("Exclusion projected")}</td><td class="number">${$(m)}</td><td class="number">${$(e.propertyA)}</td><td class="number">${$(e.exclusion)}</td><td class="number">${$(e.over)}</td><td class="number ${e.tax ? "negative" : ""}">${$(e.tax)}</td><td class="number">${m ? UI.pct(e.tax / m, 1) : "—"}</td><td class="source">${src("irs706TableA", "40% above the exclusion")}</td></tr>`;
}).join("")).join("");

const probateRows = [2026, 2040, 2045, 2050].map(y => {
  const v = MODEL.seriesFor("A", y).market, f = O.probate(v);
  return `<tr><td><strong>${y}</strong></td><td class="number">${$(v)}</td><td class="number">${$(f)}</td><td class="number">${$(f)}</td><td class="number negative">${$(2 * f)}</td><td class="source">${src("prob10800", "Section 10800")} ${src("prob10810", "Section 10810")}</td></tr>`;
}).join("");

const bRows = [2026, 2040, 2045, 2050].map(y => {
  const b = O.propertyB(y);
  return `<tr><td><strong>${y}</strong></td><td class="number">${$(b.market)}</td><td class="number">${$(b.assessed)}</td><td class="number">${$(b.tax)}</td><td class="number">${$(b.taxAtMarket)}</td><td class="number positive">${$(b.avoided)}</td><td class="source">${src("boeProp13", "Assessed value resets on a sale")}</td></tr>`;
}).join("");

main.innerHTML = UI.hero("Completeness check · 12 November 2026", "What the three choices leave out.", "The other pages compare selling, renting and living in Property A. This page checks the list itself: mixed choices, tax rules that touch only one path, the rules for each kind of inherited money, and filing steps that are not on the checklist. Nothing here changes the recommendation. Two findings make it firmer and one shows what it depends on.", `<a class="button secondary" href="plan.html">Back to the best plan</a><a class="button secondary" href="questions.html">Questions &amp; discovery</a>`) + `<div class="container">
<section class="section"><div class="grid four">
<div class="card"><div class="metric-label">Each year of waiting before the sale</div><div class="metric small">${signed(hold(1, "rent").vsSellNow)}</div><div class="tiny">Rented for one year first, inheritance in ${MID}, measured in ${MID + O.HORIZON}. Lived in: ${signed(hold(1, "live").vsSellNow)}. Left empty: ${signed(hold(1, "empty").vsSellNow)}.</div></div>
<div class="card"><div class="metric-label">Living there two years to use the home-sale exclusion</div><div class="metric small">${signed(hold(2, "live").vsSellNow)}</div><div class="tiny">Only ${$(hold(2, "live").exclusionUsed)} of the $250,000 exclusion is used, because the taxable gain starts again from the value at death.</div></div>
<div class="card warning"><div class="metric-label">Lead of selling if the pre-2021 tax rule returned</div><div class="metric small">${$(old45.sellLead)}</div><div class="tiny">Down from ${$(old45.sellLeadNow)} today. With both sides taxed at the end the two are level: ${signed(old45.sellLeadEqualTerms)}.</div></div>
<div class="card"><div class="metric-label">Money at which federal estate tax starts, 2027</div><div class="metric small">${$(O.estate(2027, 0).startsAt)}</div><div class="tiny">Official 2027 exclusion less Property A's modelled value. Above it, 40% of each further dollar.</div></div>
</div></section>

<section class="section"><div class="section-heading"><div><div class="eyebrow">1 · Mixed choices</div><h2>Hold for a while, then sell</h2><p>The published comparison holds the house for the full ten years or sells at once. These rows hold it for a shorter time, sell, and invest the proceeds until the same end date, so each figure can be set against selling at once (${$(d45.sell.terminal)} for an inheritance in ${MID}). Same assumptions as the Decision page. A minus sign means worse than selling at once.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Years held before the sale</th><th class="number">Lived in, then sold</th><th class="number">Home-sale exclusion used</th><th class="number">Rented, then sold</th><th class="number">Left empty, then sold</th><th>Rule applied</th></tr></thead><tbody>${holdRows}</tbody></table></div>
<p class="tiny">Why living there for two years does not pay: the exclusion removes tax on gain, and at inheritance the taxable gain starts again from the value at death. After two years the gain above that value, net of the 6% selling cost, is small, so most of the $250,000 goes unused, while two years of property tax, upkeep and lost investment return are paid in full. The lived-in figures count no value for the housing itself; the Best plan page shows that value separately.</p>
<div class="table-wrap"><table><thead><tr><th>Year of inheritance</th><th class="number">Sell at once, value ten years later</th><th class="number">Rent one year first</th><th class="number">Live in one year first</th><th class="number">Live in two years first</th><th class="number">Empty for one year first</th><th>Rule applied</th></tr></thead><tbody>${yearRows}</tbody></table></div>
<p class="tiny">The empty-house row is the cost of indecision: a house that stands empty while the family decides is reassessed in full, earns nothing and still costs property tax, insurance and upkeep. The Proposition 19 claim allows one year to move in; that year is not free.</p>
</section>

<section class="section"><div class="section-heading"><div><div class="eyebrow">2 · A rule the rental case leaves out</div><h2>Depreciation, and the tax that takes it back</h2><p>A rental owner deducts the building (not the land) over 27.5 years. The published rental case leaves this out. Putting it in changes the rental result by little, because the deduction mostly creates losses that cannot be used until the sale, and the sale then taxes the deduction at up to 25% federal instead of 20%. The share of the value that is building is not in the household record, so three shares are shown.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Building share of value</th><th class="number">Deduction a year</th><th class="number">Income tax saved over ten years</th><th class="number">Extra tax at the sale</th><th class="number">Value of carried losses at the sale</th><th class="number">Rental case with depreciation</th><th class="number">Change from published</th><th class="number">Selling still ahead by</th><th>Rule applied</th></tr></thead><tbody>${depRows}</tbody></table></div>
<p class="tiny">Inheritance in ${MID}, ten-year hold. Assumptions, each flagged: full-year deductions (the first-year convention is ignored); rental losses are carried forward and used only at the sale, which is the general rule; the $25,000 allowance for active owners is not applied because it ends at $150,000 of income and the owner's income is unknown; the tax rate on the deduction at sale is the model's capital-gain rate plus five points, which is the highest it can be. At the other extreme, with no tax on the deduction at the sale at all, selling would still be ahead by ${$(dep30.sellLead - dep30.extraTaxAtSale)} at a 30% building share and ${$(O.rentWithDepreciation(MID, 0.4).sellLead - O.rentWithDepreciation(MID, 0.4).extraTaxAtSale)} at 40%.</p>
</section>

<section class="section"><div class="section-heading"><div><div class="eyebrow">3 · Tax rules that touch one path only</div><h2>Rules not stated elsewhere on the site</h2><p>Each row gives the official wording in short, what it does to a path, and whether a figure can be given. Where a fact needed for a figure is missing, the figure is left blank.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Rule</th><th class="wrap">What the official page says</th><th class="wrap">Effect on the choice</th><th class="number">Figure</th><th>Official source</th></tr></thead><tbody>
<tr><td><strong>California withholding at the sale</strong></td><td class="wrap">3 1/3% of the sales price is withheld when California real estate is sold, unless the seller certifies an exemption before the close. Exemptions include a loss or zero gain, and a property last used as the decedent's principal residence when the decedent's estate or trust sells it.</td><td class="wrap">Selling path. A prepayment, not a cost, but it is recovered only on the next tax return. A sale soon after death may qualify for one of the two exemptions named; the form must reach escrow before closing.</td><td class="number">${$(O.withholdingAtSale(MID))}<div class="tiny">held back on a ${MID} sale if no exemption is certified</div></td><td class="source">${src("ftb593")}</td></tr>
<tr><td><strong>Rental losses</strong></td><td class="wrap">Rental real estate is generally a passive activity. Losses above passive income are disallowed for the year and carried forward, and are deductible in full when the whole interest is sold.</td><td class="wrap">Renting path. Depreciation does not lower the yearly tax by much; its benefit arrives at the sale.</td><td class="number">${$(dep30.carried)}<div class="tiny">carried to the sale at a 30% building share</div></td><td class="source">${src("irsTopic425")}</td></tr>
<tr><td><strong>Land is not depreciable</strong></td><td class="wrap">Land is never depreciable; property held for personal purposes cannot be depreciated.</td><td class="wrap">Renting path only. No deduction while the heir lives in the house.</td><td class="number">${blank}<div class="tiny">land and building split not supplied</div></td><td class="source">${src("irsTopic704")}</td></tr>
<tr><td><strong>Depreciation taxed at the sale</strong></td><td class="wrap">The part of the gain that comes from depreciation on real property is taxed at a maximum 25% rate.</td><td class="wrap">Renting path. Included in the table above.</td><td class="number">${$(dep30.extraTaxAtSale)}<div class="tiny">at a 30% building share</div></td><td class="source">${src("irsTopic409")}</td></tr>
<tr><td><strong>Rent first, move in later</strong></td><td class="wrap">Gain for periods after 2008 when the house was not the owner's main home cannot be excluded, with exceptions; depreciation taken cannot be excluded.</td><td class="wrap">Mixed path. Renting first and moving in later earns a smaller exclusion than moving in first. The Proposition 19 relief also requires the house to be the heir's principal residence, claimed within one year.</td><td class="number">${blank}<div class="tiny">current publication not opened</div></td><td class="source">${src("irsPub523")} ${src("boeProp19", "One-year rule")}</td></tr>
<tr><td><strong>Like-kind exchange</strong></td><td class="wrap">No gain is recognised when real property held for business or investment is exchanged solely for property of the same kind. Money received is taxed.</td><td class="wrap">Applies to Property B, or to Property A only while it is rented. Not to a home the heir lives in. Property A has little gain right after death, so there is little to defer; Property B's gain since purchase is the case where it matters, if that building were ever sold.</td><td class="number">${blank}<div class="tiny">Property B's cost basis not supplied</div></td><td class="source">${src("irsLikeKind")}</td></tr>
<tr><td><strong>Gift during life instead of inheritance</strong></td><td class="wrap">Property received as a gift keeps the donor's adjusted basis when its value is at least that basis.</td><td class="wrap">A transfer of Property A before death would carry the parent's original cost into the heir's hands, and the gain since purchase would be taxed on sale. Inheriting resets it.</td><td class="number">${blank}<div class="tiny">original cost not supplied</div></td><td class="source">${src("irsPub551")}</td></tr>
<tr><td><strong>Community property, if one parent survives the other</strong></td><td class="wrap">In California, when either spouse dies the total value of community property generally becomes the basis of the entire property, if at least half is included in the decedent's estate.</td><td class="wrap">Matters if one parent survives the other and then sells. It does not change the heir's position at the second death.</td><td class="number">${blank}<div class="tiny">how title is held not supplied</div></td><td class="source">${src("irsPub551")}</td></tr>
<tr><td><strong>Basis must match the estate return</strong></td><td class="wrap">If an estate return is filed, the executor reports values on Form 8971 and gives each beneficiary a Schedule A. The beneficiary may have to use a basis consistent with that value; a penalty can apply to a higher one.</td><td class="wrap">Selling path, and only if the estate is large enough to file. The value on the estate return then fixes the gain on the sale.</td><td class="number">${blank}<div class="tiny">depends on whether a return is filed</div></td><td class="source">${src("irsInheritedSale")}</td></tr>
</tbody></table></div></section>

<section class="section"><div class="section-heading"><div><div class="eyebrow">4 · What the recommendation depends on</div><h2>If the old reassessment rule came back</h2><p>Before 2021 a child kept the parent's assessed value whether or not the child lived in the house. A 2026 initiative to bring that rule back did not collect enough signatures, so nothing changes now. The test below shows how much of the case for selling rests on today's rule: with the old rule, renting keeps the low tax bill and the lead of selling shrinks. If both sides are taxed at the end date the two are about level.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Year of inheritance</th><th class="number">First-year property tax, today's rule</th><th class="number">First-year tax, old rule</th><th class="number">Rent ten years, today's rule</th><th class="number">Rent ten years, old rule</th><th class="number">Sell at once</th><th class="number">Selling ahead today</th><th class="number">Selling ahead, old rule</th><th class="number">Same, both taxed at the end</th><th>Official source</th></tr></thead><tbody>${oldRows}
<tr><td><strong>Status</strong></td><td colspan="8" class="wrap">The Secretary of State recorded the failure of the measure on 18 May 2026 (advisory 26138, measure number 1994, Attorney General number 25-0017). Two earlier attempts are reported in the press but were not checked on an official page. A new attempt can be filed for a later ballot, so this is a rule to watch each election cycle.</td><td class="source">${src("sosInitiative1994", "Failure notice, 18 May 2026")}</td></tr>
</tbody></table></div>
<p class="tiny">Reading: a return of the old rule after the house has been sold cannot be used. A family that expects the rule to return would have a reason to hold; nothing on an official page supports that expectation today.</p>
</section>

<section class="section"><div class="section-heading"><div><div class="eyebrow">5 · The money</div><h2>Federal estate tax by amount of money</h2><p>The amount of money in the inheritance is not in the record, so the table shows the tax for a range of amounts, added to Property A's modelled value. Property B is not counted because the heir already owns it. California has no estate or inheritance tax. For 2045 the exclusion is a projection (2% a year from the 2027 amount), not a published figure.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Year of death</th><th class="number">Money and investments</th><th class="number">Property A value</th><th class="number">Exclusion</th><th class="number">Amount above the exclusion</th><th class="number">Estate tax</th><th class="number">Tax as share of the money</th><th>Official source</th></tr></thead><tbody>${estateRows}</tbody></table></div>
<p class="tiny">Not counted because the facts are unknown, and each can move the result: gifts above the yearly exclusion already made by the parents (they use up the exclusion); an unused exclusion carried over from a parent who died first (it can add to the exclusion, but only if an estate return was filed for that parent in time); debts, costs and gifts to charity (they reduce the estate); life insurance owned by the parent (it counts in the estate).</p>
<div class="table-wrap"><table><thead><tr><th>Kind of money</th><th class="wrap">Income tax for the heir</th><th class="wrap">Counted for estate tax</th><th class="wrap">What to do, and when</th><th>Official source</th></tr></thead><tbody>
<tr><td><strong>Bank deposits and cash</strong></td><td class="wrap">Not income. Interest earned afterwards is taxed.</td><td class="wrap">Yes, at full value.</td><td class="wrap">Deposit insurance treats the accounts as if the owner were alive for six months after death. Spread large balances across banks within that time; the limit is $250,000 per depositor, per bank, per ownership category.</td><td class="source">${src("ftbInheritance")} ${src("fdicDeath", "Six-month rule")}</td></tr>
<tr><td><strong>Shares, funds and bonds in a taxable account</strong></td><td class="wrap">Not income on receipt. Basis is generally the market value on the date of death, so a sale soon after has little gain.</td><td class="wrap">Yes, at market value on the date of death.</td><td class="wrap">Get the date-of-death values from the custodian in writing. Deposit insurance does not cover investments.</td><td class="source">${src("irsInheritedSale")}</td></tr>
<tr><td><strong>Traditional retirement accounts</strong></td><td class="wrap">Taxed as ordinary income when withdrawn. Most heirs who are not the spouse must empty the account by the end of the tenth year after the year of death.</td><td class="wrap">Yes.</td><td class="wrap">Plan the withdrawals across the ten years. A large withdrawal in the year Property A is sold adds to that year's income.</td><td class="source">${src("irsBeneficiary")}</td></tr>
<tr><td><strong>Roth retirement accounts</strong></td><td class="wrap">Contributions come out tax-free; most earnings too, unless the account is less than five years old. The same ten-year rule applies.</td><td class="wrap">Yes.</td><td class="wrap">It can stay invested until the end of the tenth year.</td><td class="source">${src("irsBeneficiary")}</td></tr>
<tr><td><strong>Life insurance</strong></td><td class="wrap">Proceeds paid because of the death are generally not income. Interest paid on them is.</td><td class="wrap">Insurance is among the assets the gross estate may include.</td><td class="wrap">Ask who owns each policy. Whether a given policy is counted was not checked on an official page.</td><td class="source">${src("irsLifeInsurance")} ${src("irsEstateOverview", "Gross estate")}</td></tr>
<tr><td><strong>Income earned inside the trust after death</strong></td><td class="wrap">A trust reaches the top federal rate of 37% at $16,000 of taxable income in 2026. How income paid out to the heir is taxed was not checked on an official page.</td><td class="wrap">Not applicable; this is income after death.</td><td class="wrap">Decide with a tax adviser how long assets stay in the trust. A California trust return (Form 541) is required above $10,000 of gross income or $100 of net income.</td><td class="source">${src("irs1041es")} ${src("ftbTrusts", "Form 541 thresholds")}</td></tr>
<tr><td><strong>Amount of each kind</strong></td><td class="wrap">${blank}</td><td class="wrap">${blank}</td><td class="wrap">The record says only that the money may exceed the threshold. List each account and its type. A retirement account goes to the beneficiary named with the plan, which can differ from the trust.</td><td class="source">${src("irsBeneficiary", "Named beneficiary")}</td></tr>
</tbody></table></div></section>

<section class="section"><div class="section-heading"><div><div class="eyebrow">6 · Steps not on the checklist</div><h2>Filings and checks to add</h2><p>The Inheritance page lists the notice to heirs, the assessor's forms, the move-in and claim deadlines and the estate return. These are the steps it does not list.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Step</th><th class="wrap">When</th><th class="wrap">Why it matters</th><th>Official source</th></tr></thead><tbody>
<tr><td><strong>Check now that the deed names the trustee</strong></td><td class="wrap">Today, while the parents can sign.</td><td class="wrap">A house left outside the trust goes through probate. The statutory fees are in the table below; they are charged on the full value, without deducting any loan.</td><td class="source">${src("prob10800")}</td></tr>
<tr><td><strong>New tax number for the trust</strong></td><td class="wrap">As soon as the trust becomes irrevocable at death.</td><td class="wrap">A revocable trust that becomes irrevocable needs a new EIN. The California withholding form is completed under the trust's own name and number once it is irrevocable.</td><td class="source">${src("irsNewEin")}</td></tr>
<tr><td><strong>Tell the IRS who acts for the estate (Form 56)</strong></td><td class="wrap">When the trustee takes over.</td><td class="wrap">The IRS then deals with the trustee. The same page sets out the duty to file the parent's final income-tax return.</td><td class="source">${src("irsTopic356")}</td></tr>
<tr><td><strong>California trust return (Form 541)</strong></td><td class="wrap">For each year the trust has income above the thresholds.</td><td class="wrap">Rent, interest or a gain on the sale inside the trust triggers it. It is also how withholding is claimed back.</td><td class="source">${src("ftbTrusts")}</td></tr>
<tr><td><strong>California withholding form (Form 593)</strong></td><td class="wrap">Before escrow closes on a sale.</td><td class="wrap">Without a certified exemption, 3 1/3% of the price is held back and returned only through the next tax return.</td><td class="source">${src("ftbWithholding")}</td></tr>
<tr><td><strong>Basis statement to the heir (Form 8971, Schedule A)</strong></td><td class="wrap">Only if a federal estate return is filed.</td><td class="wrap">The heir's basis on a later sale may have to match it.</td><td class="source">${src("irs8971")}</td></tr>
<tr><td><strong>If one parent survives the other: estate return at the first death</strong></td><td class="wrap">Within nine months of that death; a simplified late route exists up to the fifth anniversary.</td><td class="wrap">The unused exclusion of the first to die passes to the survivor only if this return is filed. It matters if the money is large.</td><td class="source">${src("irsEstateFAQ")}</td></tr>
<tr><td><strong>Move deposits within six months</strong></td><td class="wrap">Within six months of death.</td><td class="wrap">For those six months the accounts stay insured as if the owner were alive. The six-month rule ends then.</td><td class="source">${src("fdicDeath")}</td></tr>
<tr><td><strong>Tell the insurer if the house will stand empty</strong></td><td class="wrap">Before the house has been empty for 60 days.</td><td class="wrap">The state insurance department's guide lists losses to a house vacant for 60 days or more among those a homeowners policy generally does not cover. The policy's own wording decides and was not read, so ask the insurer in writing.</td><td class="source">${src("cdiResGuide", "Department guide")}</td></tr>
</tbody></table></div>
<div class="table-wrap"><table><thead><tr><th>If Property A went through probate in</th><th class="number">Modelled value</th><th class="number">Personal representative</th><th class="number">Attorney</th><th class="number">Both</th><th>Official source</th></tr></thead><tbody>${probateRows}</tbody></table></div>
<p class="tiny">Statutory amounts for ordinary services only; court costs and extraordinary fees are extra and were not priced. They apply only to property that passes through probate.</p>
</section>

<section class="section"><div class="section-heading"><div><div class="eyebrow">7 · Property B</div><h2>Why keeping Property B is worth more than its rent</h2><p>Property B is taxed on an old assessed value. A sale resets the assessed value to the price paid. The yearly saving below is part of the return from holding Property B and ends when it is sold. The rules that let an owner aged 55 or over move an assessed value to a new home were not examined here.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Year</th><th class="number">Modelled market value</th><th class="number">Assessed value</th><th class="number">Tax on assessed value</th><th class="number">Tax if assessed at market</th><th class="number">Avoided each year</th><th>Rule applied</th></tr></thead><tbody>${bRows}</tbody></table></div>
<p class="tiny">Rate-based tax only, at the published San Francisco rate; fixed parcel charges are the same in both cases and are left out. Values after 2026 are the model's projections.</p>
</section>
</div>`;
</script>
</body>
</html>
