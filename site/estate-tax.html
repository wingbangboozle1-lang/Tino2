<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Federal estate-tax thresholds, real-estate-only headroom projections, California estate-tax status, portability and missing estate information."><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../assets/styles.css"></head>
<body data-title="Estate-tax headroom">
<main id="main"></main><div data-footer></div>
<script src="data/sources.js"></script><script src="data/model.js"></script><script src="../assets/app.js"></script>
<script>
const main = document.getElementById("main");
main.innerHTML = UI.hero("Estate tax · thresholds and headroom", "Real estate is only part of the estate.", "The current $15 million federal exclusion provides context—not a clearance. A real estate-only projection cannot establish filing requirements, taxable estate, available DSUE or future tax.", `<a class="button secondary" href="sources.html#watchlist">Legal-change watchlist</a>`) + `<div class="container">
<section class="section"><div class="grid four">
<div class="card"><div class="metric-label">Federal basic exclusion · deaths in 2026</div><div class="metric small">$15,000,000</div><p class="tiny"><strong>$15,480,000</strong> for deaths in 2027 (IRS, 5 Nov 2026)</p><p>${UI.source("irsEstate")} ${UI.source("irs2027")}</p></div>
<div class="card"><div class="metric-label">2026 real-estate inputs</div><div class="metric small">${UI.money(MODEL.estateRow(2026).combined)}</div><p class="tiny">Property A only; B belongs to the heir</p></div>
<div class="card"><div class="metric-label">2026 real-estate-only headroom</div><div class="metric small">${UI.money(MODEL.estateRow(2026).headroom)}</div><p class="tiny">$15,000,000 − $3,100,000</p></div>
<div class="card"><div class="metric-label">California estate return</div><div class="metric small">None</div><p class="tiny">Deaths on/after 1 Jan 2005</p><p>${UI.source("caEstate")}</p></div>
</div>
<div class="callout warning"><strong>No “no tax due” conclusion is possible.</strong> Other property, cash, investments, business interests, life insurance incidents of ownership, adjusted taxable gifts and specific gift-tax exemption can increase the filing measure. Deductions, debts, expenses, marital/charitable transfers and DSUE can change the result. All are currently unverified.</div>
</section>
<section class="section" id="levels"><div class="section-heading"><div><div class="eyebrow">Federal, state and local</div><h2>How much can be inherited before tax, at each level</h2><p>The inheritance is Property A plus money and other assets. Only the federal level has a threshold. The room shown is what is left for money and other assets after Property A alone; gifts already made, debts and deductions change it.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Level</th><th>Tax on the inheritance</th><th class="number">Allowed before tax</th><th class="number">Room left after Property A</th><th class="wrap">What it means</th><th>Official source</th></tr></thead><tbody>
<tr><td><strong>Federal · death in 2026</strong></td><td>Estate tax, top rate 40%</td><td class="number">$15,000,000</td><td class="number">${UI.money(MODEL.estateRow(2026).headroom)}</td><td class="wrap">Per person who dies. Paid by the estate, not by the heir.</td><td class="source">${UI.source("irsEstate")}</td></tr>
<tr><td><strong>Federal · death in 2027</strong></td><td>Estate tax, top rate 40%</td><td class="number">$15,480,000</td><td class="number">${UI.money(MODEL.estateRow(2027).headroom)}</td><td class="wrap">Official amount, announced 5 November 2026.</td><td class="source">${UI.source("irs2027")}</td></tr>
${[2040,2045,2050].map(y=>{const r=MODEL.estateRow(y);return `<tr><td><strong>Federal · death in ${y}</strong></td><td>Estate tax</td><td class="number">${UI.money(r.exclusion)} <span class="badge gold">Assumption</span></td><td class="number">${UI.money(r.headroom)}</td><td class="wrap">Not an official amount. The 2027 amount grown 2% a year, against Property A grown 3.5% a year. The law indexes the amount to inflation; Congress can change it.</td><td class="source">${UI.source("irs2027")}</td></tr>`}).join("")}
<tr><td><strong>Federal · the heir</strong></td><td>Income tax on a later sale</td><td class="number">Value at the date of death</td><td class="number">—</td><td class="wrap">The heir's basis is generally the fair market value at the date of death. Only the gain above it is taxed when the property is sold.</td><td class="source">${UI.source("irsInherited")}</td></tr>
<tr><td><strong>State · California</strong></td><td>None</td><td class="number">No limit</td><td class="number">—</td><td class="wrap">No estate-tax return for deaths on or after 1 January 2005. Inheritance tax is collected only for deaths before 8 June 1982.</td><td class="source">${UI.source("caEstate")}</td></tr>
<tr><td><strong>Local · county and city</strong></td><td>None</td><td class="number">No limit</td><td class="number">—</td><td class="wrap">State law bars the state and every county and city from taxing a gift, an estate, an inheritance or a transfer by reason of death.</td><td class="source">${UI.source("rtc13301")}</td></tr>
<tr><td><strong>Local · transfer tax at death</strong></td><td>None</td><td class="number">—</td><td class="number">—</td><td class="wrap">The documentary transfer tax does not apply when property passes by reason of death, outright or in trust.</td><td class="source">${UI.source("rtc11930")}</td></tr>
<tr><td><strong>Local · transfer tax if Property A is sold</strong></td><td>$1.10 per $1,000 of price</td><td class="number">—</td><td class="number">—</td><td class="wrap">County rate under state law; about ${UI.money(MODEL.inheritanceValues(2040).market*0.0011)} on the modeled 2040 value. Inside the model's 6% sale cost. Any city charge on top is not confirmed.</td><td class="source">${UI.source("rtc11911")}</td></tr>
<tr><td><strong>Local · property tax</strong></td><td>Reassessment, not an inheritance tax</td><td class="number">$1,044,586 of added value, only if the heir lives there</td><td class="number">—</td><td class="wrap">The cost that actually changes at the local level. Amount for transfers from 16 February 2025 to 15 February 2027. A rented or empty house is taxed on its full market value.</td><td class="source">${UI.source("boeLta2025009")}</td></tr>
</tbody></table></div>
<p class="tiny">The amount of money in the inheritance was not supplied, so whether the estate is over the federal threshold cannot be stated. If money and other assets exceed the room shown, each $1,000,000 above the threshold can cost up to $400,000 of federal estate tax. A surviving spouse's unused amount can be added only if a Form 706 was filed on time at the first death.</p>
</section>

<section class="section"><div class="section-heading"><div><div class="eyebrow">Current law</div><h2>Threshold, filing and payment are different questions</h2></div></div>
<div class="table-wrap"><table><thead><tr><th>Rule</th><th class="wrap">Current official position</th><th class="wrap">Planning implication</th><th>Official source</th></tr></thead><tbody>
<tr><td><strong>Basic exclusion · 2026</strong></td><td class="wrap">$15,000,000 per decedent for deaths in 2026.</td><td class="wrap">Indexed for inflation each year after 2026.</td><td class="source">${UI.source("irsEstate")}</td></tr>
<tr><td><strong>Basic exclusion · 2027</strong></td><td class="wrap">$15,480,000 per decedent for deaths in 2027, announced 5 November 2026 (IR-2026-133; Rev. Proc. 2026-35 §3.44).</td><td class="wrap">Up 3.2% in one year. Amounts for 2028 onward are not published; this dashboard indexes the 2027 amount by an assumed 2% a year.</td><td class="source">${UI.source("irs2027")}</td></tr>
<tr><td><strong>Rate above the exclusion</strong></td><td class="wrap">Top rate of 40% (Form 706 instructions, Table A — Unified Rate Schedule).</td><td class="wrap">Each $1,000,000 of taxable estate above the available exclusion can cost up to $400,000.</td><td class="source">${UI.source("irs706")}</td></tr>
<tr><td><strong>Annual gift exclusion</strong></td><td class="wrap">$19,000 per recipient in 2026; $20,000 in 2027.</td><td class="wrap">Gifts within the annual exclusion reduce a future estate without using the basic exclusion. Gifted property keeps the giver’s tax basis, unlike inherited property — ask a tax professional before gifting appreciated assets.</td><td class="source">${UI.source("irs2027")}</td></tr>
<tr><td><strong>Form 706 filing threshold</strong></td><td class="wrap">Gross estate plus adjusted taxable gifts and specific gift-tax exemption above the year-of-death threshold for a U.S. citizen/resident.</td><td class="wrap">The heir’s already-owned B is excluded from this decedent’s estate.</td><td class="source">${UI.source("irsEstateFAQ")}</td></tr>
<tr><td><strong>Portability / DSUE</strong></td><td class="wrap">An estate return is required to elect transfer of unused exclusion, even if otherwise below the filing threshold.</td><td class="wrap">No DSUE amount is included in the model; eligibility and prior elections need records.</td><td class="source">${UI.source("irsEstateFAQ")}</td></tr>
<tr><td><strong>Deadline</strong></td><td class="wrap">Form 706 and tax generally due nine months after death.</td><td class="wrap">A filing extension does not automatically extend payment.</td><td class="source">${UI.source("irs706")}</td></tr>
<tr><td><strong>California estate tax</strong></td><td class="wrap">No California estate-tax return for deaths on or after January 1, 2005.</td><td class="wrap">Federal, fiduciary and beneficiary income-tax obligations remain separate.</td><td class="source">${UI.source("caEstate")}</td></tr>
</tbody></table></div></section>
<section class="section"><div class="section-heading"><div><div class="eyebrow">Scenario only</div><h2>Decedent’s Property A versus modeled exclusion</h2><p>Property A appreciates 3.5%; B is displayed as heir-owned context only; the exclusion is $15,000,000 for 2026 and $15,480,000 for 2027 as published by the IRS, then grows at an assumed 2%. Headroom = max(0, exclusion − Property A value). Excess = max(0, Property A value − exclusion). These are not taxable-estate calculations.</p></div></div>
<div class="grid four" id="headroom-cards"></div>
<div class="table-wrap"><table><thead><tr><th>Year</th><th class="number">Property A</th><th class="number">Property B</th><th class="number">Included decedent real estate</th><th class="number">Modeled exclusion</th><th class="number">Real-estate-only headroom</th><th class="number">Real-estate-only excess</th><th>Basis</th></tr></thead><tbody id="estate-annual"></tbody></table></div>
<p class="tiny">The 2026 and 2027 exclusions are official IRS amounts. 2028–2050 exclusion values are model assumptions, not IRS announcements. Property values are household inputs grown at 3.5%, not appraisals. Headroom can be reduced by every other gross-estate item and adjusted taxable gift; deductions can have the opposite effect.</p>
</section>
<section class="section"><div class="section-heading"><div><div class="eyebrow">Incomplete estate worksheet</div><h2>The missing inputs stay blank</h2><p>No zero is inferred merely because a record was not supplied.</p></div></div>
<div class="table-wrap"><table><thead><tr><th>Estate component</th><th class="number">Verified amount</th><th>Status</th><th>Official framework</th></tr></thead><tbody>
<tr><td>Property A · official appraisal unverified</td><td class="number">—</td><td>${UI.status("input")}</td><td class="source">${UI.source("irsEstateFAQ")}</td></tr>
<tr><td>Property B · heir-owned, excluded</td><td class="number">—</td><td>${UI.status("input")}</td><td class="source">${UI.source("irsEstateFAQ")}</td></tr>
<tr><td>Cash, investments, retirement and other assets</td><td class="number">—</td><td>${UI.badge("Unverified · blank","red")}</td><td class="source">${UI.source("irs706")}</td></tr>
<tr><td>Business/entity interests and life insurance</td><td class="number">—</td><td>${UI.badge("Unverified · blank","red")}</td><td class="source">${UI.source("irs706")}</td></tr>
<tr><td>Adjusted taxable gifts / specific exemption</td><td class="number">—</td><td>${UI.badge("Unverified · blank","red")}</td><td class="source">${UI.source("irsEstateFAQ")}</td></tr>
<tr><td>Debts, expenses and deductible claims</td><td class="number">—</td><td>${UI.badge("Unverified · blank","red")}</td><td class="source">${UI.source("irs706")}</td></tr>
<tr><td>Marital / charitable deductions</td><td class="number">—</td><td>${UI.badge("Unverified · blank","red")}</td><td class="source">${UI.source("irs706")}</td></tr>
<tr><td>DSUE / portability</td><td class="number">—</td><td>${UI.badge("Unverified · blank","red")}</td><td class="source">${UI.source("irsEstateFAQ")}</td></tr>
<tr><td><strong>Actual taxable estate / tax</strong></td><td class="number"><strong>—</strong></td><td>${UI.badge("Cannot calculate","red")}</td><td class="source">${UI.source("irs706")}</td></tr>
</tbody></table></div></section>
<section class="section"><div class="grid two"><div class="card soft"><h3>What can be said now</h3><ul class="check-list"><li>The official federal exclusion is $15,000,000 for 2026 and $15,480,000 for 2027.</li><li>Only Property A is included in this decedent’s modeled estate.</li><li>Property A alone leaves $11.9 million before other estate items.</li><li>California does not require a current estate-tax return.</li><li>Form 706 can still be needed for portability.</li></ul></div><div class="card review"><h3>What cannot be said now</h3><ul class="list"><li>Whether a future estate is below its filing threshold.</li><li>Whether any federal estate tax will be due.</li><li>How much DSUE, if any, is available.</li><li>Whether future Congress changes exclusion or rates.</li><li>Whether nonresident/noncitizen special rules apply.</li></ul><p><a href="review.html">See required estate records →</a></p></div></div></section>
</div>`;
for (const year of [2026,2030,2040,2050]) {
  const e = MODEL.estateRow(year), ratio = Math.min(100,e.combined/e.exclusion*100);
  document.getElementById("headroom-cards").insertAdjacentHTML("beforeend", `<div class="card"><div class="metric-label">${year} real-estate / exclusion</div><div class="metric small">${ratio.toFixed(1)}%</div><div class="bar"><span style="width:${ratio}%"></span></div><div class="tiny">${UI.money(e.combined)} property / ${UI.money(e.exclusion)} exclusion</div></div>`);
}
for (let year=2026; year<=2050; year++) {
  const e=MODEL.estateRow(year);
  document.getElementById("estate-annual").insertAdjacentHTML("beforeend", `<tr><td>${year}</td><td class="number">${UI.money(e.a)}</td><td class="number">${UI.money(e.b)}</td><td class="number"><strong>${UI.money(e.combined)}</strong></td><td class="number">${UI.money(e.exclusion)}</td><td class="number positive">${UI.money(e.headroom)}</td><td class="number">${UI.money(e.excess)}</td><td class="source">${year<=2027 ? UI.source(year===2026 ? "irsEstate" : "irs2027", "Official exclusion + modeled value") : UI.source("irs2027", "2027 official, indexed 2% (assumption)")}</td></tr>`);
}

UI.ensureRowSources();
</script></body></html>
