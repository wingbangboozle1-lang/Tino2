<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../assets/styles.css"></head><body data-title="Black swan stress tests"><main id="main"></main><div data-footer></div>
<script src="data/sources.js"></script><script src="data/model.js"></script><script src="data/stress.js"></script><script src="../assets/app.js"></script><script>
const row=c=>'<tr>'+c.map(x=>'<td class="wrap">'+x+'</td>').join('')+'</tr>';
document.getElementById('main').innerHTML=UI.hero('Economic uncertainty · 50-year stress laboratory','A straight line is not a forecast.','Automatic scenarios compare 2045 inheritance with a common 2095 endpoint. All shock sizes, timing and future rates are hypothetical. Official links support risk context, never these invented paths.')+`<div class="container"><section class="section"><div class="callout warning"><strong>No probability or guaranteed winner.</strong> These paths are sensitivity tests, not predictions, historical replays or Monte Carlo estimates. The inherited A is modeled separately; B remains owned by the heir with its existing two rentals and available owner unit. B’s common income cancels from this incremental comparison. Living in A does not earn extra B rent. Unknown insurance quotes, actual taxes, mortgages, depreciation/recapture, estate tax and housing-service value can change the ranking. No estate-tax liability is deducted because the estate is unknown.</div></section>
<section class="section"><h2>Evidence, not extrapolation</h2><div class="table-wrap"><table><thead><tr><th>Verified observation</th><th>Decision implication</th><th>Official source</th></tr></thead><tbody>
${row(['December 2022 CPI-U: +6.5% over 12 months; electricity +14.3%.','General inflation and utilities do not move together. This does not establish local future bills.',UI.source('blsCPI')])}
${row(['California CDI recommends shopping coverage; FAIR Plan is limited coverage, not equivalent to a full homeowners policy.','Actual primary-residence and multi-unit landlord premiums remain blank/unverified. $1,500 is only a scenario input.',UI.source('insuranceResidential')])}
${row(['FDIC coverage generally $250,000 per depositor, insured bank, ownership category.','Do not park multi-million-dollar sale proceeds in a single uninsured balance. Stocks, mutual funds and Treasury securities are not FDIC deposits.',UI.source('fdic')])}
</tbody></table></div></section>
<section class="section"><h2>What each shock assumes</h2><div class="table-wrap"><table><thead><tr><th>Scenario</th><th>Hypothetical shock (unverified)</th><th>Context only</th></tr></thead><tbody>
${row(['Changing-cycle baseline','10-year repeated home growth: 4%, 5%, 2%, −4%, 0%, 6%, 4%, 3%, 4%, 3%. Portfolio net returns: 8%, 10%, 3%, −12%, 2%, 13%, 7%, 5%, 6%, 6%. Inflation: 2.5%, 3%, 4%, 3.5%, 2%, 2.5%, 3%, 2.5%, 2%, 2.5%. Rent grows 2.5%; vacancy 5%.',UI.source('blsCPI')])}
${row(['Early / late crash','First / last 3 years: home −25%, −10%, +4%; portfolio −35%, −10%, +12%; rent −5% yearly and vacancy 20%. Other years use baseline.',UI.source('investorRisk')])}
${row(['Stagflation','First 5 years: home 0%, portfolio +1%, inflation 8%, rent +2%; insurance doubles once, then inflates. Later years baseline.',UI.source('blsCPI')])}
${row(['Disaster','Year 10: home −15%, vacancy 100%, $250,000 unreimbursed repair; insurance doubles permanently. No insurance recovery assumed. Later home growth baseline.',UI.source('insuranceResidential')])}
</tbody></table></div><p>Portfolio returns are net hypothetical tax/fee returns, not observed stock returns. Year-end cash flows are reinvested at that year’s net return beginning the following year. Negative reserves represent externally funded costs compounded at that same opportunity cost; no borrowing facility is implied.</p></section>
<section class="section"><h2>Same endpoint results · 2095</h2><p>All dollars rounded to $10. Real values are in 2045 purchasing power, divided by each path’s cumulative inflation. Retained-home results include hypothetical endpoint sale costs and gain taxes, but not depreciation recapture. Live results exclude housing-service value. No route is universally best.</p><div class="table-wrap"><table><thead><tr><th>Scenario</th><th>Sell nominal / real</th><th>Rent nominal / real</th><th>Live nominal / real</th><th>Context source</th></tr></thead><tbody id="results"></tbody></table></div></section>
<section class="section"><h2>Year-by-year path audit · 2046–2095</h2><p>Tax assessment uses positive inflation capped at 2%; decline-in-value relief is not modeled. Actual assessed values and taxes remain unverified. Solar credit held flat; replacement costs are not known. Each section is a hypothetical model, not an official forecast.</p><div id="annual"></div></section>
<section class="section"><div class="card"><h2>Decision gates</h2><ol><li>Keep B’s existing two rental streams and owner unit in the baseline; do not count B in the decedent’s estate.</li><li>Before inheritance, update trust eligibility and the date-of-death appraisal; obtain local tax, landlord-insurance, repair and achievable-rent quotes privately.</li><li>Prefer sale/reinvestment only if its diversified after-tax result remains attractive after an early drawdown and sufficient liquid reserves.</li><li>Prefer renting only if collected rent covers reassessed tax, repairs, insurance and reserves under the adverse scenarios—not merely gross yield.</li><li>Choose occupancy for genuine principal-residence use and lifestyle benefit, not a presumed full preservation of the old assessment.</li></ol><p><a href="review.html">Open unresolved items</a> · <a href="decision.html">Shorter-horizon model</a> · <a href="scenarios.html">Recorded shock replays and break-even thresholds</a></p></div></section></div>`;
for(const [key,p] of Object.entries(STRESS.paths)){
 const rows=STRESS.run(key), end=rows.at(-1), pair=(n,r)=>UI.money(n)+' / '+UI.money(r);
 document.getElementById('results').insertAdjacentHTML('beforeend',row([p.name,pair(end.sell,end.realSell),pair(end.rent,end.realRent),pair(end.live,end.realLive),UI.source(p.source,'Risk context, not forecast')]));
 document.getElementById('annual').insertAdjacentHTML('beforeend',`<details class="card"><summary>${p.name} · 50 annual rows</summary><div class="table-wrap"><table><thead><tr><th>Year</th><th>Home / portfolio / inflation</th><th>A value</th><th>Rental assessment / tax</th><th>Insurance / water / maintenance</th><th>After-tax rental cash</th><th>Nominal sell / rent / live</th><th>Source context</th></tr></thead><tbody>${rows.map(r=>row([r.year,[r.home,r.portfolio,r.inflation].map(x=>UI.pct(x)).join(' / '),UI.money(r.market),pair(r.assessed,r.tax),[r.insurance,r.water,r.maintenance].map(x=>UI.money(x)).join(' / '),UI.money(r.cash),[r.sell,r.rent,r.live].map(x=>UI.money(x)).join(' / '),UI.source(p.source,'Hypothesis; context only')])).join('')}</tbody></table></div></details>`);
}

UI.ensureRowSources();
</script></body></html>
