<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Inheritance planning dashboard: comparing an anticipated Cupertino trust inheritance (Property A) with an already-owned San Francisco property (Property B), with source-linked figures and a decision gate."><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="assets/styles.css"></head><body data-title="Dashboard overview"><main id="main"></main><div data-footer></div>
<script src="site/data/sources.js"></script><script src="site/data/model.js"></script><script src="assets/app.js"></script>
<script>
const main = document.getElementById("main");
const M = window.MODEL, B = M.BASE, f = M.fmtMoney, pct = M.fmtPct;
const d40 = M.decision({ ...B, inheritYear: 2040 }, 10, "4BR");
const d45 = M.decision({ ...B, inheritYear: 2045 }, 10, "4BR");
const d50 = M.decision({ ...B, inheritYear: 2050 }, 10, "4BR");

main.innerHTML = UI.hero("Inheritance planning dashboard", "Property A versus Property B — what the numbers say, and what is still unknown", "Property A is the anticipated Cupertino trust inheritance (ZIP 95014). Property B is the San Francisco three-unit property the heir already owns (ZIP 94122) — it is not part of the decedent's estate, and that distinction drives every number below. Every dollar figure is rounded to the nearest $10. No name, street address, parcel number or account number appears on this site.")
+ `<div class="container">
<section class="section"><div class="grid four" id="headline"></div>
<p class="tiny">Base case: 3.5% a year home-price growth, 2% a year assessment growth, 5% after-tax portfolio return, inheritance in 2040 sold ten years later. These are assumptions, not forecasts. Property B rent is the supplied two-unit figure of ${f(B.bRentMonthly)} a month; the third unit is treated as available to the owner rather than rented, and that premise is supplied rather than verified.</p></section>

<section class="section"><div class="card highlight"><div class="eyebrow" style="color:#d1e8b1">Working recommendation</div><h2>Sell Property A at the transfer and reinvest — but confirm six facts first.</h2>
<p>In the base case, selling and reinvesting finishes <strong>${f(d40.sell.terminal - d40.rent.terminal)}</strong> ahead of renting Property A for ten years, and <strong>${f(d40.sell.terminal - d40.live.terminal)}</strong> ahead of living in it. The ranking holds at every inheritance year tested (2030, 2035, 2040, 2045, 2050). ${UI.source("investorRisk", "SEC · diversification")}</p>
<p><strong>The recommendation is conditional.</strong> Six facts are still blank and each can move the answer: the full gross estate and prior gifts; the trust's distribution terms; Property A's tax-rate area; the rebuild cost that sets the insurance premium; Property A's lawful bedroom count; and whether the transferee will occupy Property A as a principal residence. Confirm those first — see the <a href="site/questions-gate.html">decision gate</a>. Not legal, tax, insurance or investment advice.</p>
<div class="hero-actions"><a class="button" href="site/decision.html">Open the decision lab</a><a class="button secondary" href="site/briefing-sheet.html">Attorney &amp; CPA briefing sheet (print)</a></div>
</div></section>

<section class="section"><div class="section-heading"><div><div class="eyebrow">01 / the three paths</div><h2>Live in it, rent it, or sell — carried to the same endpoint</h2></div></div>
<div class="table-wrap"><table><thead><tr><th>Strategy</th><th class="number">Inherit 2040</th><th class="number">Inherit 2045</th><th class="number">Inherit 2050</th><th>What drives it</th><th class="source">Official rule</th></tr></thead><tbody>
<tr><td><strong>Sell &amp; reinvest</strong></td><td class="number">${f(d40.sell.terminal)}</td><td class="number">${f(d45.sell.terminal)}</td><td class="number">${f(d50.sell.terminal)}</td><td>Net proceeds after ${pct(B.saleCost, 0)} sale cost, compounded at ${pct(M.afterTaxPortfolioReturn(), 0)} after tax</td><td class="source">${UI.source("irsBasis", "IRS · stepped-up basis")}</td></tr>
<tr><td>Rent, then sell</td><td class="number">${f(d40.rent.terminal)}</td><td class="number">${f(d45.rent.terminal)}</td><td class="number">${f(d50.rent.terminal)}</td><td>After-tax rent of ${f(d40.rent.yearly[0].afterTaxCash)} in year one plus the later sale</td><td class="source">${UI.source("irsRental", "IRS Pub 527 · rental")}</td></tr>
<tr><td>Live, then sell</td><td class="number">${f(d40.live.terminal)}</td><td class="number">${f(d45.live.terminal)}</td><td class="number">${f(d50.live.terminal)}</td><td>Saves ${f(d40.transfer.primarySavings)} a year of property tax under Proposition 19; ${f(d40.live.gainExclusion)} home-sale exclusion applied</td><td class="source">${UI.source("boeProp19", "BOE · Prop 19")}</td></tr>
<tr><td><strong>Sell advantage over renting</strong></td><td class="number">${f(d40.sell.terminal - d40.rent.terminal)}</td><td class="number">${f(d45.sell.terminal - d45.rent.terminal)}</td><td class="number">${f(d50.sell.terminal - d50.rent.terminal)}</td><td>Widens as the inheritance is delayed</td><td class="source">${UI.source("investorRisk", "SEC · risk")}</td></tr>
</tbody></table></div>
<p class="tiny">The live result excludes the value of housing received, so it is understated as a pure financial comparison. ${UI.source("irsHomeSale", "IRS · home-sale exclusion")}</p>
</section>

<section class="section"><div class="section-heading"><div><div class="eyebrow">02 / what would change the answer</div><h2>Four inputs decide the ranking</h2></div></div>
<div class="table-wrap"><table><thead><tr><th>Input</th><th>Where the answer sits</th><th>What to resolve first</th><th class="source">Official reference</th></tr></thead><tbody>
<tr><td>Does the trust permit a sale?</td><td>If the trustee cannot or must not sell, every other input is irrelevant.</td><td>Trust attorney reads the instrument and amendments</td><td class="source">${UI.source("probate160617", "Probate Code §16061.7")}</td></tr>
<tr><td>Does basis step up to date-of-death value?</td><td>An immediate sale is low-tax with a step-up and heavily taxed without one.</td><td>Tax attorney reviews trust and prior Forms 709/706</td><td class="source">${UI.source("irsRevRul20232", "IRS Rev. Rul. 2023-2")}</td></tr>
<tr><td>Does family-home relief apply?</td><td>Without occupancy and a timely claim, the assessment resets to full market value.</td><td>County assessor; recipient's occupancy plan</td><td class="source">${UI.source("boeProp19", "BOE · Prop 19")}</td></tr>
<tr><td>Portfolio return vs home growth</td><td>Selling leads once the net portfolio return clears roughly 3%, at every growth rate tested.</td><td>Documented investment policy for the proceeds</td><td class="source">${UI.source("investorRisk", "SEC · risk")}</td></tr>
</tbody></table></div>
<p class="tiny">The last row is worth reading twice: on this model the portfolio rate matters less than establishing whether a step-up or Proposition 19 relief applies.</p>
</section>

<section class="section"><div class="section-heading"><div><div class="eyebrow">03 / navigate the dashboard</div><h2>Every page</h2></div></div>
<div class="grid three" id="cards"></div></section>

<section class="section"><div class="callout review"><strong>Privacy and reliability limits.</strong> No name, street address, parcel number, account number or e-mail address appears on this site; the two properties are labelled Property A and Property B, and every dollar figure is rounded to the nearest $10. Rounding is not anonymisation: a rounded financial history attached to a known location can still identify a household. This repository is public, and its earlier commits, branches and pull requests may contain material that does not appear on these pages. <a href="site/review.html">Read the full list of limits →</a></div></section>
</div>`;

document.getElementById("headline").innerHTML = [
  ["Property A · projected value 2040", f(M.seriesFor("A", 2040).market), "Cupertino, ZIP 95014 · model assumption"],
  ["Property B · projected value 2040", f(M.seriesFor("B", 2040).market), "San Francisco, ZIP 94122 · already owned"],
  ["Federal estate-tax exclusion 2027", f(M.estateRow(2027).exclusion), "IRS · official, IR-2026-133"],
  ["Sell advantage over renting, 2040", f(d40.sell.terminal - d40.rent.terminal), "Base case · ten-year holding period"]
].map(([label, value, note]) => `<div class="card soft"><div class="metric-label">${label}</div><div class="metric small">${value}</div><p class="tiny">${note}</p></div>`).join("");

document.getElementById("cards").innerHTML = [
  ["Decision lab", "site/decision.html", "Change the inheritance year, holding period, growth, rent and tax assumptions; see the phased-investing path, crash test and reinvestment risk."],
  ["Best plan", "site/plan.html", "Why selling leads, the size of the gap, the stress check across economic worlds, and the conditions under which another plan wins."],
  ["Phased-investing path", "site/decision.html", "Park sale proceeds in short-term Treasuries for 24–36 months, then phase into equities to soften 1929/2008 crash-entry risk."],
  ["Properties", "site/properties.html", "Projected value, assessment and tax by year for both parcels, plus holding costs."],
  ["SF property", "site/san-francisco.html", "Property B on its own: rent roll, tax history, direct charges and rent rules."],
  ["Operating costs", "site/operating-costs.html", "Insurance, water, electricity, solar and maintenance against official tariffs and surveys."],
  ["Black swans", "site/black-swan.html", "Fifty years of variable economic conditions: stagflation, crashes, insurance repricing, disaster."],
  ["Shock replays", "site/scenarios.html", "Named stress cases side by side with break-even home growth and portfolio return."],
  ["Trust steps", "site/inheritance.html", "How the inheritance runs step by step, with the four statutory clocks."],
  ["Estate tax", "site/estate-tax.html", "Federal estate-tax thresholds, the filing test versus deductions, portability."],
  ["Deadlines timeline", "site/timeline.html", "Trustee notice, change-in-ownership, Proposition 19, Form 706, Rent Board and Proposition H dates."],
  ["Attorney &amp; CPA briefing sheet", "site/briefing-sheet.html", "One-page printable summary for the attorney and tax adviser."],
  ["Questions / decision gate", "site/questions.html", "Open questions prioritised by whether they can change the ranking."],
  ["Decision gate", "site/questions-gate.html", "Forty questions scored against four plans."],
  ["Suggestions", "site/suggestions.html", "Proposed improvements to review before anything is implemented."],
  ["Glossary", "site/glossary.html", "Plain-language definitions of the terms used across the dashboard."],
  ["Sources", "site/sources.html", "The full register of official sources."],
  ["Verified facts", "site/verification.html", "Line-by-line ledger of figures confirmed against official publications."],
  ["Flagged for review", "site/review.html", "Blank cells, contradictory official wording, time-sensitive figures and residual privacy exposure."]
].map(([title, href, text]) => `<div class="card soft"><h3>${title}</h3><p class="muted">${text}</p><p><a class="button secondary" href="${href}">Open</a></p></div>`).join("");
</script></body></html>
