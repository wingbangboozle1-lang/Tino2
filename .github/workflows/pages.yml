name: Verify public Pages boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package canonical public files
        run: python3 scripts/package-site.py
      - name: Enforce publication boundary (including negative tests)
        run: python3 scripts/check-publication.py --self-test
      - name: Verify model, stress paths and source references
        run: |
          node scripts/validate.js
          node scripts/stress-test.js
      - name: Install isolated rendering test dependency (not published)
        run: npm install --prefix .cache/test --no-audit --no-fund --ignore-scripts jsdom@26.1.0
      - name: Verify rendered rows, runtime and local links
        run: node scripts/runtime-test.cjs
      # Pages currently uses main/root Jekyll. Audit that output too, not just _public.
      - name: Build with the GitHub Pages Jekyll builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Reject unexpected files in actual Jekyll publication
        run: python3 scripts/check-publication.py --directory _site --jekyll
