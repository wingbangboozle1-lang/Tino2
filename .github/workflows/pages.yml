name: Verify public Pages boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: verify-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      use_actions: ${{ steps.mode.outputs.use_actions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the dashboard model, pages and official sources
        run: |
          test ! -e .nojekyll
          node scripts/validate.js
          node scripts/stress-test.js
      - name: Package and audit the reviewed public dashboard
        run: |
          python3 scripts/package-site.py
          python3 scripts/check-publication.py --self-test
      - name: Install isolated test dependencies (never published)
        run: npm install --prefix .cache/test --no-audit --no-fund --ignore-scripts jsdom@26.1.0 playwright-core@1.49.1 @sparticuz/chromium@131.0.1 axe-core@4.10.3
      - name: Verify rendered pages, row sources, controls and privacy regressions
        run: |
          node scripts/runtime-test.cjs
          node qa/tools/gate.cjs
          python3 integration/tools/privacy_scan.py _public
      # Continue checking the existing branch/root Jekyll output as a safety
      # fallback, even when the configured Pages source uses Actions.
      - name: Build the legacy GitHub Pages Jekyll output
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Reject unexpected or modified Jekyll publication files
        run: python3 scripts/check-publication.py --directory _site --jekyll
      - name: Detect the configured Pages publication mode
        id: mode
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          if [ "$mode" = workflow ]; then echo 'use_actions=true' >> "$GITHUB_OUTPUT"; else echo 'use_actions=false' >> "$GITHUB_OUTPUT"; fi
      - name: Upload only the reviewed package
        if: steps.mode.outputs.use_actions == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_public

  deploy:
    needs: verify
    if: needs.verify.outputs.use_actions == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed guide
        id: deployment
        uses: actions/deploy-pages@v4
