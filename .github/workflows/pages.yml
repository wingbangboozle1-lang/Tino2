name: Verify public Pages boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: verify-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      use_actions: ${{ steps.mode.outputs.use_actions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated pages and model arithmetic
        run: |
          test ! -e .nojekyll
          python3 scripts/check-generated.py
          python3 scripts/check-figures.py
          python3 scripts/test-model-reference.py
      - name: Package and audit the reviewed public guide
        run: |
          python3 scripts/package-site.py
          python3 scripts/check-publication.py --self-test
      # The published artifact has its own $10 and source-link gates. This one covers the
      # rest of the repository, because a public repository is searchable at HEAD: a ZIP
      # code or an un-rounded household figure in the retained legacy tree is findable even
      # though no page serves it. See scripts/privacy-gate.py.
      - name: Gate every tracked file for identifiers and un-rounded amounts
        run: |
          python3 scripts/privacy-gate.py --self-test
          python3 scripts/privacy-gate.py
      # The gate above reads HEAD only. This proves the same detectors also fire inside the audit
      # that walks Git objects, so the two can never drift apart in policy. The inventory itself is
      # a separate job, because a rewrite decision needs the whole history, not a shallow checkout.
      - name: Verify the history audit applies the same detectors
        run: python3 scripts/privacy-history-audit.py --self-test
      - name: Install isolated test dependencies (never published)
        run: npm install --prefix .cache/test --no-audit --no-fund --ignore-scripts jsdom@26.1.0 playwright-core@1.49.1 @sparticuz/chromium@131.0.1 axe-core@4.10.3
      - name: Verify rendered pages, sources, controls and privacy regressions
        run: |
          node scripts/test-guide.cjs
          node scripts/privacy-audit.cjs
          node scripts/test-browser.cjs
      # The retained dashboard under site/ is not published, because it is built
      # from the household's own figures. It is still verified on every push so
      # that the work stays sound and can be republished on request.
      - name: Verify the retained dashboard (repository only, never published)
        run: |
          node scripts/validate.js
          node scripts/stress-test.js
      # Continue checking the existing branch/root Jekyll output as a safety
      # fallback, even when the configured Pages source uses Actions.
      - name: Build the legacy GitHub Pages Jekyll output
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Reject unexpected or modified Jekyll publication files
        run: python3 scripts/check-publication.py --directory _site --jekyll
      - name: Detect the configured Pages publication mode
        id: mode
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          if [ "$mode" = workflow ]; then echo 'use_actions=true' >> "$GITHUB_OUTPUT"; else echo 'use_actions=false' >> "$GITHUB_OUTPUT"; fi
      - name: Upload only the reviewed package
        if: steps.mode.outputs.use_actions == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_public

  deploy:
    needs: verify
    if: needs.verify.outputs.use_actions == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed guide
        id: deployment
        uses: actions/deploy-pages@v4

  # A separate, non-blocking job: it fetches the whole default branch and reports how many
  # objects the working-tree rules would flag. Counts and paths only, never a matched string, so
  # its own log is safe. It cannot reach other branches, pull-request refs, forks or clones, and a
  # clean report here is not proof of an anonymous history — see
  # docs/history-remediation-runbook.md for what to do with the answer.
  history-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory flagged objects across the fetched history
        continue-on-error: true
        run: python3 scripts/privacy-history-audit.py
      - name: Machine-readable counts for the ticket
        if: always()
        continue-on-error: true
        run: python3 scripts/privacy-history-audit.py --json
