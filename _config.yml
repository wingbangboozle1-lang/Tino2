# Only the privacy-reviewed public guide is served by Jekyll from main/root.
# GitHub itself remains public; exclusions are NOT repository access controls.
# Disable the default theme so no unreviewed generated theme assets are published.
theme: null
# The retained analysis tree was deleted from the default branch on 17 Nov 2026 because it
# was built from the household's own figures. What remains outside guide/ is tooling and
# policy: it is excluded from the site, but it is still in the repository, so it is still
# covered by scripts/privacy-gate.py.
exclude:
  - COORDINATION.md
  - README.md
  - docs
  - scripts
  - _public
  - _site
  - .cache
