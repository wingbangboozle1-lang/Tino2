# Only the privacy-reviewed public guide is served by Jekyll from main/root.
# GitHub itself remains public; exclusions are NOT repository access controls.
# Disable the default theme so no unreviewed generated theme assets are published.
theme: null
exclude:
  - COORDINATION.md
  - README.md
  - docs
  - research
  - src
  - dashboard
  - integration
  - scripts
  - qa
  - verification
  - css
  - site
  - pages
  - research-portal.html
  - cupertino.html
  - decision.html
  - flagged.html
  - inheritance.html
  - san-francisco.html
  - sources.html
  - taxes.html
  - assets/app.js
  - assets/styles.css
  - assets/style.css
  - assets/style.css-alternate.css
  - assets/app-old.js
  - _public
  - _site
  - .cache
